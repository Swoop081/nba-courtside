,.14);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.5)}.options-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.options-head h2{margin:0;font-size:22px}.options-close{min-width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1}.option-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid rgba(255,255,255,.1)}.option-copy strong{display:block;font-size:16px}.option-copy small{display:block;margin-top:4px;color:#9ea7b6;font-size:12px;line-height:1.3}.switch{position:relative;width:52px;height:30px;flex:0 0 52px}.switch input{position:absolute;opacity:0;pointer-events:none}.switch-track{position:absolute;inset:0;border-radius:999px;background:#39414d;transition:.2s}.switch-track:after{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.switch-track{background:#f7b928}.switch input:checked+.switch-track:after{transform:translateX(22px)}body.foil-flow-off .player-card .foil-field,body.foil-flow-off .player-card .prism,body.foil-flow-off .player-card .beam,body.foil-flow-off .player-card .foreground-energy,body.foil-flow-off .player-card .spark{display:none!important;animation:none!important}@media(max-width:430px){.topbar-actions{gap:6px}.topbar-actions .ghost-btn{padding-left:11px;padding-right:11px}.options-card{width:100%}}</style></head><body><main class="app-shell"><header class="topbar"><div class="courtside-wordmark topbar-wordmark"><img class="nba-official-logo" src="assets/brand/nba-logoman-v0.8.23.png?cb=20260904-1755-v0829" alt="NBA"><span class="courtside-type">COURTSIDE</span></div><div class="topbar-actions"><button id="optionsBtn" class="ghost-btn" type="button">Options</button><button id="newGameBtn" class="ghost-btn">New Game</button></div></header><section id="intro" class="screen active brand-intro"><div class="courtside-wordmark brand-launch-wordmark"><img class="nba-official-logo" src="assets/brand/nba-logoman-v0.8.23.png?cb=20260904-1755-v0829" alt="NBA"><span class="courtside-type">COURTSIDE</span></div><div class="brand-launch-actions"><button id="startBtn" class="primary-btn brand-start-btn">Start</button><span class="brand-version" data-build-version="0.8.29">v0.8.29</span><button id="checkUpdatesBtn" class="ghost-btn" type="button">Check for Updates</button></div></section><section id="game" class="screen"><div class="scoreboard"><div class="score-side"><span>YOU</span><strong id="userScore">0</strong></div><div class="quarter-badge"><span id="quarterLabel">Q1</span><strong id="categoryLabel">SCORING</strong></div><div class="score-side away"><span>CPU</span><strong id="cpuScore">0</strong></div></div><div class="instruction" id="instruction">Choose one unused player for this quarter</div><div id="lineup" class="card-row"></div><section id="revealPanel" class="reveal-panel game-action-panel"><div class="matchup"><div id="userReveal"></div><div class="versus">VS</div><div id="cpuReveal"></div></div><div id="quarterResult" class="quarter-result"><span class="big">0 – 0</span>Choose a player</div><button id="nextQuarterBtn" class="primary-btn" disabled>Choose a Player</button></section></section><section id="final" class="screen"><div class="final-card"><span class="kicker">FINAL</span><h2 id="finalResult">Victory</h2><div class="final-score"><div><span>YOU</span><strong id="finalUser">0</strong></div><b>–</b><div><span>CPU</span><strong id="finalCpu">0</strong></div></div><div id="quarterSummary" class="quarter-summary"></div><button id="playAgainBtn" class="primary-btn">Play Again</button></div></section></main><div id="optionsSheet" class="options-sheet hidden" aria-hidden="true"><div class="options-backdrop" data-close-options></div><section class="options-card" role="dialog" aria-modal="true" aria-labelledby="optionsTitle"><div class="options-head"><h2 id="optionsTitle">Options</h2><button class="ghost-btn options-close" type="button" data-close-options aria-label="Close options">×</button></div><label class="option-row" for="foilFlowToggle"><span class="option-copy"><strong>Foil Flow on Cards</strong><small>Turn the moving foil, beam and shimmer effects on or off.</small></span><span class="switch"><input id="foilFlowToggle" type="checkbox" checked><span class="switch-track"></span></span></label></section></div><script src="app.js?cb=20260904-1755-v0829"></script><script src="art-v0.8.20.js?cb=20260904-1755-v0829"></script><script src="presentation-v0.8.15.js?cb=20260904-1755-v0829"></script><script>(()=>{const panel=document.getElementById('revealPanel'),result=document.getElementById('quarterResult'),next=document.getElementById('nextQuarterBtn');const setWaitingPanel=()=>{if(!panel||!result||!next||!window.state)return;panel.classList.remove('hidden');const label=STAT_LABELS[state.category]||'Player';result.innerHTML=`<span class="big">${state.userScore} – ${state.cpuScore}</span>${state.overtime?'Overtime':('Q'+state.quarter)} · ${label}`;next.textContent=state.overtime?'Playing Final Card…':`Choose a ${label} Player`;next.disabled=true;};const baseBegin=beginQuarter;beginQuarter=function(){baseBegin();setWaitingPanel();};const basePlay=playQuarter;playQuarter=function(id){basePlay(id);if(next){next.disabled=false;panel?.classList.remove('hidden');}};setWaitingPanel();const optionsKey='nbaCourtsideOptionsV1',sheet=document.getElementById('optionsSheet'),toggle=document.getElementById('foilFlowToggle'),openBtn=document.getElementById('optionsBtn');const readOptions=()=>{try{return JSON.parse(localStorage.getItem(optionsKey)||'{}')}catch{return {}}};const applyOptions=()=>{const saved=readOptions(),foil=saved.foilFlow!==false;document.body.classList.toggle('foil-flow-off',!foil);if(toggle)toggle.checked=foil;};const closeOptions=()=>{sheet?.classList.add('hidden');sheet?.setAttribute('aria-hidden','true')};openBtn?.addEventListener('click',()=>{applyOptions();sheet?.classList.remove('hidden');sheet?.setAttribute('aria-hidden','false')});sheet?.querySelectorAll('[data-close-options]').forEach(el=>el.addEventListener('click',closeOptions));toggle?.addEventListener('change',()=>{const saved=readOptions();saved.foilFlow=toggle.checked;localStorage.setItem(optionsKey,JSON.stringify(saved));applyOptions()});applyOptions();})();</script><script>(()=>{const actions=document.querySelector('.brand-launch-actions');const keep=document.getElementById('checkUpdatesBtn');const dedupe=()=>{if(!actions||!keep)return;actions.querySelectorAll('button').forEach(b=>{if(b!==keep&&b.id!=='startBtn'&&(b.textContent||'').toLowerCase().includes('up to date'))b.remove();});actions.querySelectorAll('.ghost-btn').forEach(b=>{if(b!==keep)b.remove();});};dedupe();if(actions)new MutationObserver(dedupe).observe(actions,{childList:true,subtree:true});const btn=keep;const label=document.querySelector('.brand-version');if(!btn||!label)return;btn.addEventListener('click',async()=>{const loaded=(label.dataset.buildVersion||label.textContent||'').replace(/^v/i,'').trim();btn.textContent='Checking…';try{const r=await fetch('https://raw.githubusercontent.com/Swoop081/nba-courtside/main/build.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('update check failed');const b=await r.json();const latest=String(b.version||'').replace(/^v/i,'').trim();if(latest&&latest!==loaded){btn.textContent='Update Available · v'+latest;btn.onclick=()=>location.replace('/nba-courtside/?build='+encodeURIComponent(b.commit||latest)+'&ts='+Date.now());setTimeout(()=>location.replace('/nba-courtside/?build='+encodeURIComponent(b.commit||latest)+'&ts='+Date.now()),350);}else{btn.textContent='Up to Date · v'+(latest||loaded);}}catch(e){btn.textContent='Retry Update Check';}});})();</script></body></html>
