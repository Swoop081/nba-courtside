<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#070811" />
<title>NBA Courtside — Franchise Shell v0.3</title>
<style>
:root{--bg:#070811;--panel:#11131f;--panel2:#171a28;--panel3:#202437;--text:#f7f8ff;--muted:#9da2b8;--line:#2b2f43;--accent:#dfff31;--team:#006bb6;--team2:#ed174c;--warn:#ffb21c;--danger:#ff4d6d;--good:#74f0aa;--blue:#64a9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;min-height:100%}body{overflow-x:hidden}button,input,select{font:inherit}.hidden{display:none!important}.app{min-height:100vh;background:radial-gradient(circle at 25% -10%,color-mix(in srgb,var(--team) 28%,transparent),transparent 38%),var(--bg)}
.screen{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 94px)}
.kicker{font-size:10px;letter-spacing:.22em;font-weight:950;color:var(--accent);text-transform:uppercase}.muted{color:var(--muted)}
/* start */
#startScreen{min-height:100vh;padding:calc(env(safe-area-inset-top) + 24px) 14px 36px;background:radial-gradient(circle at 85% 0,#3743ff33,transparent 32%),radial-gradient(circle at 0 35%,#ff006633,transparent 34%),#070811}.startInner{max-width:760px;margin:auto}.brand{font-size:12px;letter-spacing:.28em;font-weight:950;color:var(--accent)}.startTitle{font-size:clamp(42px,12vw,74px);line-height:.84;margin:12px 0 10px;letter-spacing:-.065em;font-weight:1000}.startSub{max-width:580px;color:#b7bbcc;font-weight:700;line-height:1.45;font-size:14px}.eraPill{display:inline-flex;gap:8px;align-items:center;border:1px solid #ffffff1c;background:#ffffff09;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;letter-spacing:.1em;margin:16px 0 12px}.conferenceTabs{display:flex;gap:7px;margin:7px 0 12px;position:sticky;top:8px;z-index:4;padding:8px 0;background:linear-gradient(#070811ee,#070811cc,transparent)}.confBtn{border:1px solid var(--line);background:var(--panel);color:#c8cbda;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:900}.confBtn.active{background:white;color:#080910;border-color:white}.teamGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:600px){.teamGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}.teamPick{min-height:154px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--pick1) 34%,#151726),#0f111b 70%);color:white;text-align:left;padding:14px}.teamPick img{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 10px 15px #0009)}.teamPick strong{display:block;font-size:16px;line-height:1.05;margin-top:8px;letter-spacing:-.03em}.teamPick span{display:block;margin-top:5px;color:#c5c9d9;font-size:9px;font-weight:900;letter-spacing:.1em}.teamPick:active{transform:scale(.985)}
/* header/nav */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 1px 12px}.club{display:flex;gap:10px;align-items:center;min-width:0}.club img{width:42px;height:42px;object-fit:contain}.clubName{font-size:17px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clubMeta{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.12em;margin-top:2px}.changeBtn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:white;font-size:18px}.bottomNav{position:fixed;z-index:50;left:0;right:0;bottom:0;background:#0b0d16f5;border-top:1px solid #ffffff12;backdrop-filter:blur(18px);padding:7px 8px calc(env(safe-area-inset-bottom) + 7px)}.bottomNavInner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navBtn{border:0;background:transparent;color:#7f8498;display:grid;justify-items:center;gap:2px;padding:7px 2px;border-radius:12px;font-size:9px;font-weight:900;letter-spacing:.04em}.navBtn b{font-size:19px;line-height:1}.navBtn.active{color:white;background:#ffffff0b}.navBtn.active b{color:var(--team2)}
/* reusable */
.hero{position:relative;overflow:hidden;border:1px solid #ffffff15;border-radius:30px;min-height:262px;padding:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--team) 72%,#10121d),#10121d 55%,color-mix(in srgb,var(--team2) 50%,#10121d));box-shadow:0 20px 60px #0008}.heroLogo{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 8px 18px #0009)}.hero h1{font-size:38px;line-height:.9;letter-spacing:-.06em;margin:12px 0 6px;font-weight:1000;max-width:62%}.hero .record{font-size:11px;letter-spacing:.13em;font-weight:900;color:#e8eaf4}.heroPeople{position:absolute;right:-10px;bottom:-4px;width:52%;height:92%;pointer-events:none}.heroPeople img{position:absolute;bottom:0;width:70%;height:92%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 15px 20px #0009)}.heroPeople img:nth-child(1){right:24%;z-index:3}.heroPeople img:nth-child(2){right:-2%;height:80%;z-index:2}.heroPeople img:nth-child(3){right:48%;height:76%;z-index:1;opacity:.88}.heroStats{position:absolute;left:18px;right:18px;bottom:15px;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:62%}.mini{background:#070811b8;border:1px solid #ffffff15;border-radius:14px;padding:9px;min-width:0}.mini b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini span{font-size:8px;color:#c5c8d4;font-weight:900;letter-spacing:.09em}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:18px 2px 9px}.sectionHead h2{font-size:24px;letter-spacing:-.045em;margin:0}.sectionHead span,.linkBtn{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.09em;text-transform:uppercase}.linkBtn{border:0;background:none;color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:15px}.notice{border-radius:18px;padding:13px 14px;background:#ffffff08;border:1px solid #ffffff0d;font-size:12px;font-weight:750;line-height:1.4}.notice strong{color:white}.notice.warn{background:#ffb21c12;border-color:#ffb21c35}.notice.danger{background:#ff4d6d12;border-color:#ff4d6d35}.notice.good{background:#74f0aa10;border-color:#74f0aa30}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;background:#ffffff10;color:#c9ccda;font-size:8px;letter-spacing:.08em;font-weight:950;text-transform:uppercase}.salary{color:var(--accent);font-weight:950}.scrollRow{display:flex;overflow:auto;gap:9px;padding-bottom:2px;scrollbar-width:none}.scrollRow::-webkit-scrollbar{display:none}
/* players */
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.starter{position:relative;border:0;padding:0;border-radius:17px;overflow:hidden;background:var(--panel);color:white;min-width:0;text-align:left}.starterPhoto{height:88px;position:relative;background:linear-gradient(150deg,color-mix(in srgb,var(--team) 50%,#171a28),#171a28)}.starterPhoto img{width:100%;height:100%;object-fit:cover;object-position:center 10%}.starterFallback{width:100%;height:100%;display:grid;place-items:center;font-size:24px;font-weight:950}.starterPos{position:absolute;top:6px;left:6px;background:#070811d8;border-radius:8px;padding:3px 5px;font-size:8px;font-weight:950}.starterOvr{position:absolute;top:6px;right:6px;background:var(--accent);color:#071000;border-radius:8px;padding:3px 5px;font-size:9px;font-weight:1000}.starterName{padding:7px 6px 9px;font-size:9px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playerGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}@media(min-width:600px){.playerGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}.playerCard{border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--team) 26%,#181b29),#10121c 62%);color:white;border-radius:22px;overflow:hidden;text-align:left;padding:0;min-width:0}.pcPhoto{height:132px;position:relative;overflow:hidden}.pcPhoto img{width:100%;height:100%;object-fit:cover;object-position:center 13%}.pcShade{position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#11131f)}.pcOvr{position:absolute;top:9px;left:9px;background:#070811e8;border-radius:10px;padding:5px 7px;font-size:16px;font-weight:1000}.pcTag{position:absolute;top:9px;right:9px;background:var(--team2);border-radius:999px;padding:5px 7px;font-size:7px;font-weight:1000;letter-spacing:.08em}.pcInfo{padding:10px}.pcName{font-size:15px;font-weight:1000;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcMeta{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.08em;margin-top:3px;text-transform:uppercase}.pcSalary{font-size:12px;margin-top:7px;color:var(--accent);font-weight:950}
/* roster/depth */
.depthList{display:grid;gap:7px}.depthRow{display:grid;grid-template-columns:34px 54px 1fr auto;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:8px}.depthPos{font-size:10px;font-weight:1000;letter-spacing:.09em;color:var(--team2)}.depthRow img,.smallFace{width:54px;height:54px;border-radius:13px;object-fit:cover;background:var(--panel3)}.depthName{font-size:14px;font-weight:950}.depthMeta{font-size:9px;color:var(--muted);font-weight:850;margin-top:3px}.depthRight{text-align:right}.depthRight b{display:block;font-size:16px}.depthRight span{font-size:8px;color:var(--accent);font-weight:900}.groupLabel{font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:950;margin:16px 2px 7px;text-transform:uppercase}
/* cap */
.capHero{border-radius:28px;padding:19px;background:linear-gradient(145deg,color-mix(in srgb,var(--team) 45%,#141725),#10121c);border:1px solid var(--line)}.capBig{font-size:43px;font-weight:1000;letter-spacing:-.055em;line-height:1}.capStatus{font-size:10px;letter-spacing:.14em;font-weight:950;color:var(--accent);margin-top:5px}.capTrack{margin-top:18px;height:16px;background:#ffffff10;border-radius:999px;position:relative;overflow:hidden}.capFill{height:100%;background:linear-gradient(90deg,var(--team2),var(--accent));border-radius:999px}.thresholds{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.thresholds div{font-size:8px;color:var(--muted);font-weight:900}.thresholds b{display:block;color:white;font-size:10px;margin-bottom:2px}.contractList{display:grid;gap:7px}.contractPlayer{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:8px}.contractPlayer img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--panel3)}.contractPlayer strong{font-size:13px}.contractPlayer small{display:block;color:var(--muted);font-weight:800;margin-top:2px}.contractMoney{text-align:right}.contractMoney b{font-size:14px;color:var(--accent)}.contractMoney span{display:block;font-size:8px;color:var(--muted);font-weight:900;margin-top:2px}.future{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.futureBox{border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:11px}.futureBox span{font-size:8px;color:var(--muted);font-weight:900}.futureBox b{display:block;font-size:15px;margin-top:3px}
/* market */
.marketHero{border-radius:28px;padding:18px;background:linear-gradient(135deg,#5422c8,#1a1730 55%,#e52c7533);border:1px solid #ffffff18}.marketHero h2{font-size:31px;line-height:.92;margin:6px 0;letter-spacing:-.05em}.marketCard{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:11px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:9px;margin-top:8px}.marketCard img{width:76px;height:76px;border-radius:16px;object-fit:cover;background:var(--panel3)}.marketName{font-weight:1000}.marketMeta{font-size:9px;color:var(--muted);font-weight:900;margin-top:3px}.marketAmount{text-align:right}.marketAmount b{display:block;color:var(--accent);font-size:13px}.marketAmount span{font-size:8px;color:var(--muted);font-weight:900}
/* trades */
.partnerStrip{display:flex;gap:7px;overflow:auto;padding:4px 0 8px;scrollbar-width:none}.partnerStrip::-webkit-scrollbar{display:none}.partner{flex:0 0 52px;width:52px;height:52px;border-radius:15px;border:1px solid var(--line);background:var(--panel);padding:8px}.partner img{width:100%;height:100%;object-fit:contain}.partner.active{border:2px solid var(--team2);background:color-mix(in srgb,var(--team2) 12%,var(--panel))}.offerSide{border-radius:22px;background:var(--panel);border:1px solid var(--line);padding:11px;margin-top:9px}.offerHead{display:flex;align-items:center;gap:8px;margin-bottom:9px}.offerHead img{width:34px;height:34px;object-fit:contain}.offerHead strong{font-size:14px}.assetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.asset{position:relative;border:1px solid var(--line);background:var(--panel2);border-radius:15px;padding:0;overflow:hidden;color:white;min-width:0}.asset img{width:100%;height:72px;object-fit:cover;object-position:center 12%;display:block}.asset b{display:block;font-size:8px;padding:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset.selected{border:2px solid var(--accent);box-shadow:0 0 0 2px #dfff3122}.asset.selected:after{content:'✓';position:absolute;top:5px;right:5px;background:var(--accent);color:#071000;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-weight:1000;font-size:11px}.tradeSummary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.tradeSum{background:#ffffff07;border-radius:15px;padding:10px}.tradeSum span{font-size:8px;color:var(--muted);font-weight:900}.tradeSum b{display:block;font-size:16px;margin-top:2px}.propose{width:100%;border:0;border-radius:18px;background:var(--accent);color:#071000;font-weight:1000;padding:14px;margin-top:9px}.response{margin-top:9px;border-radius:18px;padding:13px;background:#ffffff08;font-size:12px;font-weight:800;line-height:1.4}
/* player sheet */
.sheet{position:fixed;z-index:100;inset:0;background:#070811;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.85,.2,1);padding-bottom:calc(env(safe-area-inset-bottom) + 25px)}.sheet.open{transform:none}.sheetInner{max-width:760px;margin:auto}.sheetHero{position:relative;min-height:350px;padding:calc(env(safe-area-inset-top) + 12px) 16px 20px;overflow:hidden;background:linear-gradient(145deg,var(--team),#10111b 67%)}.sheetHero:after{content:"";position:absolute;inset:52% 0 0;background:linear-gradient(transparent,#070811)}.close{position:relative;z-index:9;width:44px;height:44px;border-radius:15px;border:1px solid #ffffff30;color:white;background:#0809109e;font-size:25px}.bigPortrait{position:absolute;width:95%;height:310px;right:-16%;bottom:0;object-fit:contain;object-position:center bottom;z-index:1;filter:drop-shadow(0 20px 30px #0009)}.sheetTitle{position:absolute;z-index:4;left:16px;right:16px;bottom:16px}.sheetTitle h1{font-size:41px;line-height:.88;margin:0;max-width:70%;font-weight:1000;letter-spacing:-.06em}.sheetTitle p{margin:8px 0 0;color:#e6e8f1;font-weight:900;font-size:11px}.sheetContent{padding:0 14px}.profileStats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.profileStat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}.profileStat b{font-size:20px;display:block}.profileStat span{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.08em}.profileCard{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:15px}.profileCard h3{margin:0 0 10px;font-size:19px}.ratings{display:grid;gap:7px}.ratingLine{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center}.ratingLine span{font-size:11px;font-weight:850}.ratingLine b{font-size:14px;text-align:right}.ratingBar{grid-column:1/-1;height:5px;background:#ffffff10;border-radius:999px;overflow:hidden;margin-top:-4px}.ratingBar i{display:block;height:100%;background:linear-gradient(90deg,var(--team2),var(--accent));border-radius:999px}.yearScroll{display:flex;overflow:auto;gap:7px;scrollbar-width:none}.yearBox{flex:0 0 116px;background:var(--panel2);border-radius:15px;padding:10px}.yearBox span{font-size:8px;color:var(--muted);font-weight:900}.yearBox b{font-size:14px;display:block;margin:3px 0}.yearBox em{font-style:normal;font-size:8px;color:var(--accent);font-weight:900;text-transform:uppercase}
@media(max-width:390px){.hero{min-height:250px}.hero h1{font-size:34px}.heroStats{max-width:66%}.starterPhoto{height:78px}.starterName{font-size:8px}.teamGrid{gap:8px}.asset img{height:65px}}
</style>
</head>
<body>
<div id="startScreen"><div class="startInner"><div class="brand">NBA COURTSIDE</div><h1 class="startTitle">RUN<br>THE LEAGUE.</h1><div class="startSub">Take control of a real 2026–27 franchise. Build the roster, manage contracts and cap pressure, explore the market and shape the next era.</div><div class="eraPill">2026–27 START · FROZEN 19 AUG 2026</div><div class="conferenceTabs"><button class="confBtn active" data-conf="All">ALL TEAMS</button><button class="confBtn" data-conf="East">EAST</button><button class="confBtn" data-conf="West">WEST</button></div><div class="teamGrid" id="teamGrid"></div></div></div>
<div class="app hidden" id="gameApp"><main class="screen"><header class="topbar" id="topbar"></header><div id="view"></div></main><nav class="bottomNav"><div class="bottomNavInner"><button class="navBtn active" data-view="home"><b>⌂</b>HOME</button><button class="navBtn" data-view="roster"><b>◉</b>ROSTER</button><button class="navBtn" data-view="cap"><b>$</b>CAP</button><button class="navBtn" data-view="market"><b>＋</b>MARKET</button><button class="navBtn" data-view="trade"><b>⇄</b>TRADE</button></div></nav></div>
<div class="sheet" id="sheet"><div class="sheetInner" id="sheetInner"></div></div>
<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
