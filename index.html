.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.starter{position:relative;border:0;padding:0;border-radius:17px;overflow:hidden;background:var(--panel);color:white;min-width:0;text-align:left}.starterPhoto{height:88px;position:relative;background:linear-gradient(150deg,color-mix(in srgb,var(--team) 50%,#171a28),#171a28)}.starterPhoto img{width:100%;height:100%;object-fit:cover;object-position:center 10%}.starterFallback{width:100%;height:100%;display:grid;place-items:center;font-size:24px;font-weight:950}.starterPos{position:absolute;top:6px;left:6px;background:#070811d8;border-radius:8px;padding:3px 5px;font-size:8px;font-weight:950}.starterOvr{position:absolute;top:6px;right:6px;background:var(--accent);color:#071000;border-radius:8px;padding:3px 5px;font-size:9px;font-weight:1000}.starterName{padding:7px 6px 9px;font-size:9px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playerGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}@media(min-width:600px){.playerGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}.playerCard{border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--team) 26%,#181b29),#10121c 62%);color:white;border-radius:22px;overflow:hidden;text-align:left;padding:0;min-width:0}.pcPhoto{height:132px;position:relative;overflow:hidden}.pcPhoto img{width:100%;height:100%;object-fit:cover;object-position:center 13%}.pcShade{position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#11131f)}.pcOvr{position:absolute;top:9px;left:9px;background:#070811e8;border-radius:10px;padding:5px 7px;font-size:16px;font-weight:1000}.pcTag{position:absolute;top:9px;right:9px;background:var(--team2);border-radius:999px;padding:5px 7px;font-size:7px;font-weight:1000;letter-spacing:.08em}.pcInfo{padding:10px}.pcName{font-size:15px;font-weight:1000;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcMeta{font-size:8px;color:v
