urn {}}};const applyOptions=()=>{const saved=readOptions(),foil=saved.foilFlow===true;document.body.classList.toggle('foil-flow-off',!foil);if(toggle)toggle.checked=foil;};const closeOptions=()=>{sheet?.classList.add('hidden');sheet?.setAttribute('aria-hidden','true')};openBtn?.addEventListener('click',()=>{applyOptions();sheet?.classList.remove('hidden');sheet?.setAttribute('aria-hidden','false')});sheet?.querySelectorAll('[data-close-options]').forEach(el=>el.addEventListener('click',closeOptions));toggle?.addEventListener('change',()=>{const saved=readOptions();saved.foilFlow=toggle.checked;localStorage.setItem(optionsKey,JSON.stringify(saved));applyOptions()});applyOptions();})();</script><script>(()=>{const btn=document.getElementById('checkUpdatesBtn'),label=document.querySelector('.brand-version');if(!btn||!label)return;const clean=v=>String(v||'').replace(/^v/i,'').trim();const hardLoad=async build=>{btn.disabled=true;btn.textContent='Updating…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}}catch(e){}const token=encodeURIComponent(build.commit||build.version||Date.now());location.replace('/nba-courtside/?release='+token+'&ts='+Date.now());};btn.addEventListener('click',async()=>{btn.disabled=true;btn.textContent='Checking…';try{const r=await fetch('https://raw.githubusercontent.com/Swoop081/nba-courtside/main/build.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const b=await r.json(),latest=clean(b.version),loaded=clean(label.dataset.buildVersion||label.textContent);if(latest&&latest!==loaded){await hardLoad(b);}else{btn.textContent='Up to Date · v'+(latest||loaded);btn.disabled=false;}}catch(e){btn.textContent='Retry Update Check';btn.disabled=false;}});})();</script></body></html>
