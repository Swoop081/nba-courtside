y-content:space-between;align-items:center;margin-bottom:14px}.options-head h2{margin:0;font-size:22px}.options-close{min-width:44px;height:44px;border-radius:50%;font-size:24px}.option-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid rgba(255,255,255,.1)}.option-copy strong{display:block;font-size:16px}.option-copy small{display:block;margin-top:4px;color:#9ea7b6;font-size:12px;line-height:1.3}.switch{position:relative;width:52px;height:30px;flex:0 0 52px}.switch input{position:absolute;opacity:0;pointer-events:none}.switch-track{position:absolute;inset:0;border-radius:999px;background:#39414d;transition:.2s}.switch-track:after{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.switch-track{background:#f7b928}.switch input:checked+.switch-track:after{transform:translateX(22px)}body.foil-flow-off .player-card .edge-glow,body.foil-flow-off .player-card .beam{display:none!important;animation:none!important}.player-card .stats .stat:nth-child(4){display:none!important}.player-card .stats{display:grid!important;grid-template-rows:repeat(7,minmax(0,1fr))!important;align-items:center!important;gap:0!important}.player-card .stats .stat{min-height:0!important;align-self:center!important}.player-card .stat:not(.active) .stat-circle{background:#11151c!important;border-color:rgba(255,255,255,.5)!important;box-shadow:0 3px 8px rgba(0,0,0,.58)!important;color:#fff!important;transform:none!important;filter:none!important}.catalogue-launch-btn{width:100%;min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,#1a2230,#0b0f15);color:#fff;font-weight:900;font-size:15px;letter-spacing:.04em;margin-top:8px}.catalogue-screen{padding-bottom:28px}.catalogue-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.catalogue-title{font-size:12px;font-weight:1000;letter-spacing:.18em;color:#f7b928}.catalogue-set-filter{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 12px;scrollbar-width:none}.catalogue-set-btn{white-space:nowrap;border:1px solid rgba(255,255,255,.14);background:#10151d;color:#aeb6c3;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:900}.catalogue-set-btn.active{background:#f7b928;color:#080a0d;border-color:#f7b928}.catalogue-team-browser{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:10px;margin:0 0 14px;padding:16px 8px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:linear-gradient(180deg,#121822,#090c11)}.catalogue-arrow{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:#111720;color:#fff;font-size:31px;display:grid;place-items:center}.catalogue-team-focus{text-align:center;min-width:0}.catalogue-team-logo{display:block;width:82px;height:82px;object-fit:contain;margin:0 auto 7px}.catalogue-team-name{display:block;font-size:17px}.catalogue-team-meta{display:block;margin-top:4px;font-size:9px;font-weight:900;letter-spacing:.12em;color:#8f99a8;text-transform:uppercase}.catalogue-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:start}.catalogue-grid>.player-card{width:100%;min-width:0;pointer-events:none}.catalogue-empty{aspect-ratio:.68;border-radius:16px;border:1px dashed rgba(255,255,255,.12);background:#0a0d12;display:grid;place-items:center}.catalogue-empty img{width:45%;height:45%;object-fit:contain;opacity:.12}.catalogue-grid .stat-circle{width:23px;height:23px;flex-basis:23px}.catalogue-grid .stat-circle b{font-size:9px}.catalogue-grid .stats{width:51px;left:4px;top:6px;bottom:37px}.catalogue-grid .stat{gap:2px}.catalogue-grid .stat-label{font-size:5px;max-width:23px}.catalogue-grid .identity{height:36px;padding:5px 29px 4px 7px}.catalogue-grid .identity h3{font-size:9px!important;margin-bottom:2px}.catalogue-grid .identity p{font-size:4.7px}.catalogue-grid .team-logo{width:23px;height:23px;right:5px;bottom:6px}.catalogue-grid .art-stage{bottom:36px}@media(max-width:430px){.topbar-actions{gap:6px}.topbar-actions .ghost-btn{padding-left:11px;padding-right:11px}.catalogue-team-logo{width:76px;height:76px}.catalogue-team-browser{grid-template-columns:50px 1fr 50px}.catalogue-grid{gap:7px}}</style></head><body><main class="app-shell"><header class="topbar"><div class="courtside-wordmark topbar-wordmark"><img class="nba-official-logo" src="assets/brand/nba-logoman-v0.8.23.png" alt="NBA"><span class="courtside-type">COURTSIDE</span></div><div class="topbar-actions"><button id="optionsBtn" class="ghost-btn" type="button">Options</button><button id="newGameBtn" class="ghost-btn">New Game</button></div></header><section id="intro" class="screen active brand-intro"><div class="courtside-wordmark brand-launch-wordmark"><img class="nba-official-logo" src="assets/brand/nba-logoman-v0.8.23.png" alt="NBA"><span class="courtside-type">COURTSIDE</span></div><div class="brand-launch-actions"><button id="startBtn" class="primary-btn brand-start-btn">Start</button><button id="catalogueBtn" class="catalogue-launch-btn" type="button">Catalogue</button><span class="brand-version" data-build-version="0.8.52">v0.8.52</span><button id="checkUpdatesBtn" class="ghost-btn" type="button">Check for Updates</button></div></section><section id="game" class="screen"><div class="scoreboard"><div class="score-side"><span>YOU</span><strong id="userScore">0</strong></div><div class="quarter-badge"><span id="quarterLabel">Q1</span><strong id="categoryLabel">SCORING</strong></div><div class="score-side away"><span>CPU</span><strong id="cpuScore">0</strong></div></div><div class="instruction" id="instruction">Choose one unused player for this quarter</div><div id="lineup" class="card-row"></div><section id="revealPanel" class="reveal-panel game-action-panel"><div class="matchup"><div id="userReveal"></div><div class="versus">VS</div><div id="cpuReveal"></div></div><div id="quarterResult" class="quarter-result"><span class="big">0 – 0</span>Choose a player</div><button id="nextQuarterBtn" class="primary-btn" disabled>Choose a Player</button></section></section><section id="catalogue" class="screen catalogue-screen"><div class="catalogue-toolbar"><button id="closeCatalogueBtn" class="ghost-btn" type="button">← Back</button><div class="catalogue-title">CARD CATALOGUE</div></div><div id="catalogueSetFilter" class="catalogue-set-filter"></div><div class="catalogue-team-browser"><button id="cataloguePrevTeam" class="catalogue-arrow" type="button">‹</button><div class="catalogue-team-focus"><img id="catalogueTeamLogo" class="catalogue-team-logo" alt=""><strong id="catalogueTeamName" class="catalogue-team-name"></strong><span id="catalogueTeamMeta" class="catalogue-team-meta"></span></div><button id="catalogueNextTeam" class="catalogue-arrow" type="button">›</button></div><div id="catalogueGrid" class="catalogue-grid"></div></section><section id="final" class="screen"><div class="final-card"><span class="kicker">FINAL</span><h2 id="finalResult">Victory</h2><div class="final-score"><div><span>YOU</span><strong id="finalUser">0</strong></div><b>–</b><div><span>CPU</span><strong id="finalCpu">0</strong></div></div><div id="quarterSummary" class="quarter-summary"></div><button id="playAgainBtn" class="primary-btn">Play Again</button></div></section></main><div id="optionsSheet" class="options-sheet hidden" aria-hidden="true"><div class="options-backdrop" data-close-options></div><section class="options-card"><div class="options-head"><h2>Options</h2><button class="ghost-btn options-close" type="button" data-close-options>×</button></div><label class="option-row" for="foilFlowToggle"><span class="option-copy"><strong>Diagonal Foil Glow</strong><small>Turn the diagonal moving light sweep across the cards on or off.</small></span><span class="switch"><input id="foilFlowToggle" type="checkbox"><span class="switch-track"></span></span></label></section></div><script>['app.js','art-v0.8.20.js','heat-seekers-v0.8.52.js','presentation-v0.8.15.js'].forEach(f=>document.write('<script src="'+f+'?t='+window.COURTSIDE_ASSET_TOKEN+'"><\/script>'));</script><script>(()=>{const panel=document.getElementById('revealPanel'),result=document.getElementById('quarterResult'),next=document.getElementById('nextQuarterBtn');const waiting=()=>{if(!panel||!result||!next||!window.state)return;panel.classList.remove('hidden');const label=STAT_LABELS[state.category]||'Player';result.innerHTML=`<span class="big">${state.userScore} – ${state.cpuScore}</span>${state.overtime?'Overtime':'Q'+state.quarter} · ${label}`;next.textContent=state.overtime?'Playing Final Card…':`Choose a ${label} Player`;next.disabled=true};const bb=beginQuarter;beginQuarter=function(){bb();waiting()};const bp=playQuarter;playQuarter=function(id){bp(id);if(next){next.disabled=false;panel?.classList.remove('hidden')}};const key='nbaCourtsideOptionsV1',sheet=document.getElementById('optionsSheet'),toggle=document.getElementById('foilFlowToggle'),open=document.getElementById('optionsBtn');const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}},apply=()=>{const on=read().foilFlow===true;document.body.classList.toggle('foil-flow-off',!on);if(toggle)toggle.checked=on},close=()=>sheet?.classList.add('hidden');open?.addEventListener('click',()=>{apply();sheet?.classList.remove('hidden')});sheet?.querySelectorAll('[data-close-options]').forEach(x=>x.addEventListener('click',close));toggle?.addEventListener('change',()=>{const s=read();s.foilFlow=toggle.checked;localStorage.setItem(key,JSON.stringify(s));apply()});apply()})();</script><script>(()=>{const btn=document.getElementById('checkUpdatesBtn'),label=document.querySelector('.brand-version');const sync=async()=>{try{const r=await fetch('build.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;const b=await r.json();if(label&&b.version){label.textContent='v'+b.version;label.dataset.buildVersion=b.version}return b}catch{return null}};window.addEventListener('DOMContentLoaded',()=>setTimeout(sync,350));btn?.addEventListener('click',async()=>{btn.disabled=true;btn.textContent='Checking…';const b=await sync();if(!b){btn.textContent='Retry Update Check';btn.disabled=false;return}btn.textContent='Loading v'+b.version+'…';try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch{}location.replace('/nba-courtside/?release='+encodeURIComponent(b.commit||b.version)+'&t='+Date.now())})})();</script></body></html>
