name: Materialize Classic Team PNG Logos

on:
  push:
    paths:
      - '.github/workflows/materialize-classic-logo-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converters
        run: pip install cairosvg pillow requests
      - name: Build transparent era-specific PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import requests, cairosvg
          from PIL import Image

          root=Path('assets/team-logos/classic')
          root.mkdir(parents=True,exist_ok=True)
          local=[
            'boston-celtics-1986','charlotte-hornets-1993','chicago-bulls-1998','dallas-mavericks-1995',
            'detroit-pistons-2004','houston-rockets-1995','los-angeles-lakers-1987','los-angeles-lakers-2002',
            'miami-heat-2013','phoenix-suns-2007','san-antonio-spurs-2005','seattle-supersonics-1996',
            'toronto-raptors-2003','utah-jazz-1997','vancouver-grizzlies-1997'
          ]
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'})

          def normalize(img,out):
            img=img.convert('RGBA')
            img.thumbnail((1024,1024),Image.Resampling.LANCZOS)
            canvas=Image.new('RGBA',(1024,1024),(0,0,0,0))
            canvas.alpha_composite(img,((1024-img.width)//2,(1024-img.height)//2))
            canvas.save(out,'PNG',optimize=True)

          for stem in local:
            src=root/f'{stem}.svg'
            if not src.exists(): raise SystemExit(f'Missing source SVG: {src}')
            raw=cairosvg.svg2png(bytestring=src.read_bytes(),output_width=1024,output_height=1024)
            normalize(Image.open(BytesIO(raw)),root/f'{stem}.png')

          # Exact historical marks for the five teams without a local source file.
          png_sources={
            'boston-celtics-2008':'https://brandlogos.net/wp-content/uploads/2014/11/boston_celtics-logo_brandlogos.net_n6sec-512x567.png',
            'dallas-mavericks-2011':'https://brandlogos.net/wp-content/uploads/2014/12/dallas_mavericks_2001-2017-logo_brandlogos.net_gucmb-512x534.png',
            'detroit-pistons-1989':'https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_of_the_Detroit_Pistons_%281978%E2%80%931996%29.png',
            'indiana-pacers-2000':'https://i.logos-download.com/4116/31571-s640-0f5a88a5a6c0f71275089fee4472a665.png/Indiana_Pacers_Logo_1990-s640.png?dl=',
            'sacramento-kings-2002':'https://brandlogos.net/wp-content/uploads/2014/12/sacramento_kings_1994-2016-logo_brandlogos.net_3qkxb-512x637.png'
          }
          for stem,url in png_sources.items():
            r=session.get(url,timeout=30); r.raise_for_status()
            normalize(Image.open(BytesIO(r.content)),root/f'{stem}.png')
          PY
      - name: Commit PNG assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/team-logos/classic/*.png
          if git diff --cached --quiet; then
            echo 'No PNG changes to commit.'
          else
            git commit -m 'Add local transparent PNG logos for all Classic Teams'
            git push
          fi
