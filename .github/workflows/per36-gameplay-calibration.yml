name: Per36 gameplay calibration
on:
  push:
    branches: [per36-gameplay-weighting]
    paths:
      - 'per36-gameplay-calibration.py'
      - '.github/workflows/per36-gameplay-calibration.yml'
permissions:
  contents: write
jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: per36-gameplay-weighting
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run calibration
        run: python per36-gameplay-calibration.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stats-per36-current-150-gameplay.json PER36-150-GAMEPLAY-CALIBRATION.md
          git commit -m "Build gameplay-weighted 150-player Per36 calibration"
          git push
