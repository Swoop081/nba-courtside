name: Fix Vancouver Transparent Logo v0.10.76

on:
  push:
    paths:
      - '.github/workflows/fix-vancouver-transparent-v0.10.76.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-transparent-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Rebuild Vancouver logo with true alpha
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import deque
          src='assets/team-logos/classic/vancouver-grizzlies-1997.png'
          out='assets/team-logos/classic/vancouver-grizzlies-1997-transparent-v2.png'
          im=Image.open(src).convert('RGBA')
          px=im.load(); w,h=im.size
          # Identify the square matte from border pixels, then flood-fill only that connected background.
          border=[]
          for x in range(w): border += [px[x,0],px[x,h-1]]
          for y in range(h): border += [px[0,y],px[w-1,y]]
          opaque=[c for c in border if c[3]>0]
          if opaque:
            bg=tuple(sum(c[i] for c in opaque)//len(opaque) for i in range(3))
          else:
            bg=(255,255,255)
          def matte(c):
            r,g,b,a=c
            if a==0: return True
            d=((r-bg[0])**2+(g-bg[1])**2+(b-bg[2])**2)**0.5
            # Wide enough for JPEG/GIF-style white/grey matte fringe, but connected-only protects logo whites.
            return d<=95 or (r>=220 and g>=220 and b>=220 and max(r,g,b)-min(r,g,b)<=35)
          q=deque(); seen=set()
          for x in range(w): q.append((x,0)); q.append((x,h-1))
          for y in range(h): q.append((0,y)); q.append((w-1,y))
          while q:
            x,y=q.popleft()
            if x<0 or y<0 or x>=w or y>=h or (x,y) in seen: continue
            seen.add((x,y))
            if not matte(px[x,y]): continue
            r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0)
            q.extend(((x+1,y),(x-1,y),(x,y+1),(x,y-1)))
          # Remove faint matte fringe directly adjacent to transparency.
          for _ in range(2):
            kill=[]
            for y in range(1,h-1):
              for x in range(1,w-1):
                r,g,b,a=px[x,y]
                if a==0: continue
                if not (r>=215 and g>=215 and b>=215): continue
                if any(px[nx,ny][3]==0 for nx,ny in ((x+1,y),(x-1,y),(x,y+1),(x,y-1))): kill.append((x,y))
            for x,y in kill:
              r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0)
          im.save(out,'PNG',optimize=True)
          print('saved',out,im.size)
          PY
      - name: Commit new versioned transparent logo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/team-logos/classic/vancouver-grizzlies-1997-transparent-v2.png
          git commit -m 'Add truly transparent Vancouver 1997 logo v2'
          git push
