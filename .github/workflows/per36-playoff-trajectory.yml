name: Per36 playoff trajectory
on:
  push:
    branches: [per36-playoff-trajectory]
    paths:
      - 'per36-playoff-trajectory.py'
      - '.github/workflows/per36-playoff-trajectory.yml'
permissions:
  contents: write
jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: per36-playoff-trajectory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parquet dependencies
        run: pip install pandas pyarrow
      - name: Run playoff trajectory audit
        run: python per36-playoff-trajectory.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stats-per36-current-150-playoff-trajectory.json PER36-150-PLAYOFF-TRAJECTORY.md
          git commit -m "Build 150-player playoff trajectory calibration"
          git push
