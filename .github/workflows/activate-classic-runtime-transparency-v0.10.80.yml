name: Activate Classic Runtime Transparency v0.10.80

on:
  push:
    paths:
      - '.github/workflows/activate-classic-runtime-transparency-v0.10.80.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load runtime transparency hotfix and bump build
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('heat-seekers-v0.8.52.js')
          s=p.read_text()
          s=s.replace('/* NBA Starting5 v0.10.76 — single Classic logo authority + true Vancouver transparency + preserved art layouts + Starting5 presentation */','/* NBA Starting5 v0.10.80 — runtime Classic transparency enforcement + single Classic logo authority + preserved art layouts + Starting5 presentation */',1)
          needle="  document.write('<script src=\"classic-logo-authority-v0.10.76.js?t='+t+'\"><\\/script>');"
          add=needle+"\n  document.write('<script src=\"classic-logo-runtime-transparency-v0.10.80.js?t='+t+'\"><\\/script>');"
          if 'classic-logo-runtime-transparency-v0.10.80.js' not in s:
            if needle not in s: raise SystemExit('Classic logo authority loader line not found')
            s=s.replace(needle,add,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heat-seekers-v0.8.52.js
          git commit -m 'Activate v0.10.80 runtime Classic logo transparency'
          LOADER_SHA=$(git rev-parse HEAD)
          printf '{"version":"0.10.80","build":"20260906-1455","commit":"%s"}\n' "$LOADER_SHA" > build.json
          git add build.json
          git commit -m 'Set NBA Starting5 v0.10.80 build metadata'
          git pull --rebase origin main
          git push origin HEAD:main
