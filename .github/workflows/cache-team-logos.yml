name: Cache NBA team logos

on:
  push:
    paths:
      - '.github/workflows/cache-team-logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-team-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current and Classic Team logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/team-logos/current assets/team-logos/classic/official

          ids=(
            1610612737 1610612738 1610612751 1610612766 1610612741 1610612739
            1610612742 1610612743 1610612765 1610612744 1610612745 1610612754
            1610612746 1610612747 1610612763 1610612748 1610612749 1610612750
            1610612740 1610612752 1610612760 1610612753 1610612755 1610612756
            1610612757 1610612758 1610612759 1610612761 1610612762 1610612764
          )
          for id in "${ids[@]}"; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://cdn.nba.com/logos/nba/${id}/global/L/logo.svg" \
              -o "assets/team-logos/current/${id}.svg"
          done

          get_logo(){
            local url="$1" out="$2"
            curl --fail --location --retry 3 --retry-delay 1 --silent --show-error "$url" -o "assets/team-logos/classic/official/$out"
          }

          get_logo 'https://content.sportslogos.net/logos/6/227/full/toronto_raptors_logo_primary_19961665.png' 'toronto-raptors-2003.png'
          get_logo 'https://content.sportslogos.net/logos/6/221/full/chicago_bulls_logo_primary_19672598.png' 'chicago-bulls-1998.png'
          get_logo 'https://cdn.nba.com/logos/nba/1610612747/primary/L/logo.svg' 'los-angeles-lakers-1987.svg'
          get_logo 'https://cdn.nba.com/logos/nba/1610612747/primary/L/logo.svg' 'los-angeles-lakers-2002.svg'
          get_logo 'https://content.sportslogos.net/logos/6/223/full/lgv5ssjmmchyoe66kkvh0tlzd.png' 'detroit-pistons-1989.png'
          get_logo 'https://content.sportslogos.net/logos/6/223/full/detroit_pistons_logo_primary_20029975.png' 'detroit-pistons-2004.png'
          get_logo 'https://content.sportslogos.net/logos/6/238/full/phoenix_suns_logo_primary_20016802.png' 'phoenix-suns-2007.png'
          get_logo 'https://content.sportslogos.net/logos/6/228/full/dallas_mavericks_logo_primary_19945760.png' 'dallas-mavericks-1995.png'
          get_logo 'https://content.sportslogos.net/logos/6/228/full/ifk08eam05rwxr3yhol3whdcm.png' 'dallas-mavericks-2011.png'
          get_logo 'https://content.sportslogos.net/logos/6/213/full/boston_celtics_logo_primary_19759952.png' 'boston-celtics-1986.png'
          get_logo 'https://content.sportslogos.net/logos/6/213/full/boston_celtics_logo_primary_19979720.png' 'boston-celtics-2008.png'
          get_logo 'https://content.sportslogos.net/logos/6/256/full/charlotte_hornets_logo_primary_19896932.png' 'charlotte-hornets-1993.png'
          get_logo 'https://content.sportslogos.net/logos/6/234/full/utah_jazz_logo_primary_19973688.png' 'utah-jazz-1997.png'
          get_logo 'https://cdn.nba.com/logos/nba/1610612748/primary/L/logo.svg' 'miami-heat-2013.svg'
          get_logo 'https://content.sportslogos.net/logos/6/241/full/seattle_supersonics_logo_primary_19967583.png' 'seattle-supersonics-1996.png'
          get_logo 'https://content.sportslogos.net/logos/6/257/full/7hc558rh9vls8j6fam4hly46n.gif' 'vancouver-grizzlies-1997.gif'
          get_logo 'https://content.sportslogos.net/logos/6/240/full/832.png' 'sacramento-kings-2002.png'
          get_logo 'https://content.sportslogos.net/logos/6/224/full/oj83q73haoquhxqfiurpfhsgf.png' 'indiana-pacers-2000.png'

      - name: Verify logo inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/team-logos/current -type f | wc -l)" -eq 30
          test -s assets/team-logos/current/1610612759.svg
          test -s assets/team-logos/classic/official/phoenix-suns-2007.png
          test -s assets/team-logos/classic/official/utah-jazz-1997.png
          test -s assets/team-logos/classic/official/vancouver-grizzlies-1997.gif
          test -s assets/team-logos/classic/official/detroit-pistons-1989.png
          test -s assets/team-logos/classic/official/boston-celtics-2008.png

      - name: Commit cached logos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/team-logos
          if git diff --cached --quiet; then
            echo 'No team-logo changes to commit.'
            exit 0
          fi
          git commit -m 'Cache NBA team logos locally'
          git pull --rebase origin main
          git push
