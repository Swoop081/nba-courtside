name: Fix Classic Logo Matte v0.10.78

on:
  push:
    paths:
      - '.github/workflows/fix-classic-logo-matte-v0.10.78.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-problem-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Remove internal white mattes from problem Classic logos
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          from collections import deque

          files=[
            'sacramento-kings-2002-alpha-v3.png',
            'indiana-pacers-2000-alpha-v3.png',
            'houston-rockets-1995-alpha-v3.png',
            'san-antonio-spurs-2005-alpha-v3.png',
          ]
          root=Path('assets/team-logos/classic')
          for name in files:
            src=root/name
            out=root/name.replace('-alpha-v3.png','-alpha-v4.png')
            im=Image.open(src).convert('RGBA'); px=im.load(); w,h=im.size
            opaque=[(x,y) for y in range(h) for x in range(w) if px[x,y][3] > 8]
            if not opaque:
              im.save(out,'PNG',optimize=True); continue
            xs=[p[0] for p in opaque]; ys=[p[1] for p in opaque]
            x0,x1=min(xs),max(xs); y0,y1=min(ys),max(ys)

            # White matte can be inset inside an otherwise transparent canvas.
            # Seed flood-fill from the perimeter of the opaque bounding box rather than the image edge.
            def matte(c):
              r,g,b,a=c
              if a<=8: return True
              neutral=max(r,g,b)-min(r,g,b) <= 48
              return neutral and r>=190 and g>=190 and b>=190

            q=deque()
            for x in range(x0,x1+1): q.extend(((x,y0),(x,y1)))
            for y in range(y0,y1+1): q.extend(((x0,y),(x1,y)))
            seen=set(); removed=0
            while q:
              x,y=q.popleft()
              if x<x0 or y<y0 or x>x1 or y>y1 or (x,y) in seen: continue
              seen.add((x,y))
              if not matte(px[x,y]): continue
              r,g,b,a=px[x,y]
              if a>0:
                px[x,y]=(r,g,b,0); removed+=1
              q.extend(((x+1,y),(x-1,y),(x,y+1),(x,y-1)))

            # Clean only pale fringe immediately touching the now-transparent matte.
            for _ in range(3):
              kill=[]
              for y in range(max(1,y0),min(h-1,y1+1)):
                for x in range(max(1,x0),min(w-1,x1+1)):
                  r,g,b,a=px[x,y]
                  if a==0: continue
                  neutral=max(r,g,b)-min(r,g,b)<=55
                  if not (neutral and r>=205 and g>=205 and b>=205): continue
                  if any(px[nx,ny][3]==0 for nx,ny in ((x+1,y),(x-1,y),(x,y+1),(x,y-1))):
                    kill.append((x,y))
              for x,y in kill:
                r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0); removed+=1

            im.save(out,'PNG',optimize=True)
            print(name,'removed',removed,'pixels ->',out.name)
          PY
      - name: Commit corrected problem logos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/team-logos/classic/*-alpha-v4.png
          git commit -m 'Remove inset white mattes from Classic logos v0.10.78'
          git pull --rebase origin main
          git push origin HEAD:main
