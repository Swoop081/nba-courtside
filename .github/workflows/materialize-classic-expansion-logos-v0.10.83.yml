name: Materialize Classic Expansion Logos v0.10.83
on:
  push:
    paths:
      - '.github/workflows/materialize-classic-expansion-logos-v0.10.83.yml'
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Download transparent era-correct logos
        run: |
          python - <<'PY'
          import io, os, requests
          from PIL import Image
          os.makedirs('assets/team-logos/classic',exist_ok=True)
          sources={
            'orlando-magic-1995.png':'https://content.sportslogos.net/logos/6/217/full/orlando_magic_logo_primary_19905119.png',
            'charlotte-bobcats-2007.png':'https://content.sportslogos.net/logos/6/258/full/8qy7zreof44lznm0kfwvjmvge.gif',
            'los-angeles-clippers-2014.png':'https://content.sportslogos.net/logos/6/236/full/los_angeles_clippers_logo_primary_20117648.png'
          }
          sess=requests.Session(); sess.headers['User-Agent']='Mozilla/5.0'
          for out,url in sources.items():
            r=sess.get(url,timeout=30); r.raise_for_status()
            im=Image.open(io.BytesIO(r.content)).convert('RGBA')
            if im.width<150 or im.height<100: raise RuntimeError(f'Unexpected image size for {out}: {im.size}')
            im.save('assets/team-logos/classic/'+out,'PNG')
            print(out,im.size,min(p[3] for p in im.getdata()),max(p[3] for p in im.getdata()))
          PY
      - name: Commit logos
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/team-logos/classic/orlando-magic-1995.png assets/team-logos/classic/charlotte-bobcats-2007.png assets/team-logos/classic/los-angeles-clippers-2014.png
          git commit -m 'Add three Classic expansion team logos v0.10.83' || exit 0
          git push
