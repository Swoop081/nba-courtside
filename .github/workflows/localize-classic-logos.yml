name: Localize Classic Team Logos

on:
  push:
    branches: [classic-logo-localize-temp]
    paths:
      - .github/workflows/localize-classic-logos.yml

permissions:
  contents: write

jobs:
  localize:
    if: github.event.head_commit.message == 'Add Classic logo localization workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: classic-logo-localize-temp
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --quiet pillow

      - name: Download and normalize historical logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/team-logos/classic .tmp-classic-logos
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          from PIL import Image
          from collections import deque

          root=Path('.')
          tmp=root/'.tmp-classic-logos'
          out=root/'assets/team-logos/classic'

          sources={
            'philadelphia-76ers-2001-transparent.png':[
              'https://content.sportslogos.net/logos/6/218/full/fge4lf9ridpgum631fb0gg9tt.png',
              'https://flyclipart.com/thumb2/philadelphia-logo-141042.png'
            ],
            'new-york-knicks-2012-transparent.png':[
              'https://content.sportslogos.net/logos/6/216/full/new_york_knicks_logo_primary_20129558.png'
            ],
            'cleveland-cavaliers-2004-transparent.png':[
              'https://content.sportslogos.net/logos/6/222/full/cleveland_cavaliers_logo_primary_20046125.png'
            ],
            'cleveland-cavaliers-1993-transparent.png':[
              'https://content.sportslogos.net/logos/6/222/full/cleveland_cavaliers_logo_primary_19846739.png'
            ],
            'san-antonio-spurs-1999-transparent.png':[
              'https://content.sportslogos.net/logos/6/233/full/e04ylwkfdofkr2ctlerjov26s.png'
            ],
            'orlando-magic-2009-transparent.png':[
              'https://content.sportslogos.net/logos/6/217/full/orlando_magic_logo_primary_20017625.png'
            ]
          }

          def download(name, urls):
            target=tmp/name
            for url in urls:
              cmd=['curl','-fL','--retry','2','--connect-timeout','15','--max-time','60','-A','Mozilla/5.0','-e','https://www.sportslogos.net/','-o',str(target),url]
              try:
                subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL)
                with Image.open(target) as im:
                  im.verify()
                return target
              except Exception:
                target.unlink(missing_ok=True)
            raise RuntimeError(f'Could not download valid image for {name}')

          def make_transparent(src,dst):
            im=Image.open(src).convert('RGBA')
            px=im.load(); w,h=im.size
            # Only remove light neutral pixels connected to an outside edge.
            def removable(x,y):
              r,g,b,a=px[x,y]
              return a>0 and min(r,g,b)>=232 and max(r,g,b)-min(r,g,b)<=24
            q=deque(); seen=set()
            for x in range(w):
              for y in (0,h-1):
                if removable(x,y): q.append((x,y)); seen.add((x,y))
            for y in range(h):
              for x in (0,w-1):
                if removable(x,y) and (x,y) not in seen: q.append((x,y)); seen.add((x,y))
            while q:
              x,y=q.popleft(); r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0)
              for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                if 0<=nx<w and 0<=ny<h and (nx,ny) not in seen and removable(nx,ny):
                  seen.add((nx,ny)); q.append((nx,ny))
            alpha=im.getchannel('A')
            bbox=alpha.getbbox()
            if bbox: im=im.crop(bbox)
            pad=max(12,round(max(im.size)*0.04))
            canvas=Image.new('RGBA',(im.width+pad*2,im.height+pad*2),(0,0,0,0))
            canvas.alpha_composite(im,(pad,pad))
            canvas.save(dst,'PNG',optimize=True)

          for name,urls in sources.items():
            src=download(name,urls)
            make_transparent(src,out/name)
            with Image.open(out/name) as im:
              if im.mode!='RGBA' or im.getchannel('A').getextrema()[0] == 255:
                raise RuntimeError(f'{name} did not retain transparency')
              print(name, im.size)
          PY

      - name: Point Classic Teams at local transparent assets
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
            'https://flyclipart.com/thumb2/philadelphia-logo-141042.png':'assets/team-logos/classic/philadelphia-76ers-2001-transparent.png',
            'https://content.sportslogos.net/logos/6/216/full/new_york_knicks_logo_primary_20129558.png':'assets/team-logos/classic/new-york-knicks-2012-transparent.png',
            'https://content.sportslogos.net/logos/6/222/full/cleveland_cavaliers_logo_primary_20046125.png':'assets/team-logos/classic/cleveland-cavaliers-2004-transparent.png',
            'https://content.sportslogos.net/logos/6/222/full/cleveland_cavaliers_logo_primary_19846739.png':'assets/team-logos/classic/cleveland-cavaliers-1993-transparent.png',
            'https://content.sportslogos.net/logos/6/233/full/e04ylwkfdofkr2ctlerjov26s.png':'assets/team-logos/classic/san-antonio-spurs-1999-transparent.png',
            'https://content.sportslogos.net/logos/6/217/full/orlando_magic_logo_primary_20017625.png':'assets/team-logos/classic/orlando-magic-2009-transparent.png'
          }
          files=[Path('classic-logo-expansion-authority-v0.10.84.js'),Path('classic-expansion-v0.10.84.js'),Path('classic-expansion-v0.11.30.js')]
          for p in files:
            s=p.read_text()
            before=s
            for old,new in replacements.items(): s=s.replace(old,new)
            p.write_text(s)
            print(p, 'changed' if s!=before else 'unchanged')
          PY

      - name: Commit localized logos and mappings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/team-logos/classic classic-logo-expansion-authority-v0.10.84.js classic-expansion-v0.10.84.js classic-expansion-v0.11.30.js
          git commit -m 'Localize remaining Classic Team logos'
          ASSET_SHA=$(git rev-parse HEAD)
          python - <<PY
          import json
          p='build.json'
          b=json.load(open(p))
          b.update(version='0.13.0-dev.19',build='20260908-1545',commit='${ASSET_SHA}',channel='classic-logo-localization')
          open(p,'w').write(json.dumps(b,separators=(',',':'))+'\n')
          PY
          git add build.json
          git commit -m 'Bump build for localized Classic logos'
          git push origin HEAD:classic-logo-localize-temp
