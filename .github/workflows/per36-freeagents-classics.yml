name: Per36 free agents and classics
on:
  push:
    branches: [per36-freeagents-classics]
    paths:
      - 'per36-freeagents-classics.py'
      - '.github/workflows/per36-freeagents-classics.yml'
permissions:
  contents: write
jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: per36-freeagents-classics
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Run calibration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('per36-freeagents-classics.py')
          s=p.read_text()
          s=s.replace('nba_players_25_26_regular_season_wide_data.csv','nba_players_regular_season_25_26_wide_data.csv')
          replacement='''def modern_regular_map():\n    df=pd.read_csv(io.StringIO(download_text(MODERN_REG_URL)))\n    out={}\n    for _,r in df.iterrows():\n        k=norm(r['player_name']); m=float(r['minutes_played'] or 0)\n        if not k or m<=0: continue\n        vals={\n          'scoring':(float(r['one_point_made'] or 0)+2*float(r['two_point_made'] or 0)+3*float(r['three_point_made'] or 0))/m*36,\n          'rebounding':(float(r['offensive_rebounds'] or 0)+float(r['defensive_rebounds'] or 0))/m*36,\n          'passing':float(r['assists'] or 0)/m*36,\n          'three':float(r['three_point_made'] or 0)/m*36,\n          'steals':float(r['steals'] or 0)/m*36,\n          'blocks':float(r['blocks'] or 0)/m*36,\n        }\n        gp=float(r['wins'] or 0)+float(r['losses'] or 0)\n        if k not in out or m>out[k]['minutes']: out[k]={'minutes':m,'gp':gp,'raw':vals,'row':r}\n    return out\n\n'''
          s=re.sub(r'def modern_regular_map\(\):.*?(?=def parquet_rows)',replacement,s,flags=re.S)
          s=s.replace("regmpg=current['minutes']/max(1,float(current['row'].get('gp',current['row'].get('GP',82)) or 82))","regmpg=current['minutes']/max(1,current.get('gp',82))")
          s=s.replace("int(float(r[draft])) if draft and not pd.isna(r[draft]) else 0","int(float(r[draft])) if draft and not pd.isna(r[draft]) and str(r[draft]).replace('.', '', 1).isdigit() else 0")
          p.write_text(s)
          PY
          python per36-freeagents-classics.py
      - name: Validate JavaScript and calibration integrity
        run: |
          node --check season-free-agent-pool-v0.13.1.js
          for f in $(python - <<'PY'
          import json
          print(' '.join(json.load(open('stats-per36-classics.json'))['classicFiles']))
          PY
          ); do node --check "$f"; done
          python - <<'PY'
          import json
          fa=json.load(open('stats-per36-free-agents.json'))
          cl=json.load(open('stats-per36-classics.json'))
          assert fa['count']==30
          assert cl['count']>0
          for p in fa['players']+cl['players']:
              assert p['new'][1]==p['old'][1], (p['name'],'dunk changed')
              assert all(5<=v<=30 for i,v in enumerate(p['new']) if i!=1)
          print({'freeAgents':fa['count'],'classicEntries':cl['count'],'classicFiles':len(cl['classicFiles'])})
          PY
      - name: Commit calibrated ratings
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add per36-freeagents-classics.py season-free-agent-pool-v0.13.1.js classic-*.js stats-per36-free-agents.json stats-per36-classics.json PER36-FREE-AGENTS.md PER36-CLASSICS.md
          git commit -m "Apply gameplay-weighted Per36 to free agents and classics"
          git push
