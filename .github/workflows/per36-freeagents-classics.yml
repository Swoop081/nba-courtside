name: Per36 free agents and classics
on:
  push:
    branches: [per36-freeagents-classics]
    paths:
      - 'per36-freeagents-classics.py'
      - '.github/workflows/per36-freeagents-classics.yml'
permissions:
  contents: write
jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: per36-freeagents-classics
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Run calibration
        run: |
          sed -i 's/nba_players_25_26_regular_season_wide_data.csv/nba_players_regular_season_25_26_wide_data.csv/' per36-freeagents-classics.py
          python per36-freeagents-classics.py
      - name: Validate JavaScript and calibration integrity
        run: |
          node --check season-free-agent-pool-v0.13.1.js
          for f in $(python - <<'PY'
          import json
          print(' '.join(json.load(open('stats-per36-classics.json'))['classicFiles']))
          PY
          ); do node --check "$f"; done
          python - <<'PY'
          import json
          fa=json.load(open('stats-per36-free-agents.json'))
          cl=json.load(open('stats-per36-classics.json'))
          assert fa['count']==30
          assert cl['count']>0
          for p in fa['players']+cl['players']:
              assert p['new'][1]==p['old'][1], (p['name'],'dunk changed')
              assert all(5<=v<=30 for i,v in enumerate(p['new']) if i!=1)
          print({'freeAgents':fa['count'],'classicEntries':cl['count'],'classicFiles':len(cl['classicFiles'])})
          PY
      - name: Commit calibrated ratings
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add per36-freeagents-classics.py season-free-agent-pool-v0.13.1.js classic-*.js stats-per36-free-agents.json stats-per36-classics.json PER36-FREE-AGENTS.md PER36-CLASSICS.md
          git commit -m "Apply gameplay-weighted Per36 to free agents and classics"
          git push
