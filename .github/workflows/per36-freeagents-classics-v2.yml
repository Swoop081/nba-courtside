name: Per36 free agents and classics v2
on:
  push:
    branches: [per36-freeagents-classics-v2]
    paths:
      - 'per36-freeagents-classics.py'
      - '.github/workflows/per36-freeagents-classics-v2.yml'
permissions:
  contents: write
jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: per36-freeagents-classics-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow
      - name: Calibrate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('per36-freeagents-classics.py'); s=p.read_text()
          s=s.replace("cols={'scoring':cc('pts'),'rebounding':cc('trb'),'passing':cc('ast'),'three':cc('3p','x3p','fg3m'),'steals':cc('stl'),'blocks':cc('blk')}","cols={'scoring':cc('pts_per_36_min'),'rebounding':cc('trb_per_36_min'),'passing':cc('ast_per_36_min'),'three':cc('x3p_per_36_min'),'steals':cc('stl_per_36_min'),'blocks':cc('blk_per_36_min')}")
          s=s.replace("year=int(seasons[-1]) if seasons else 0","year=int(seasons[-1]) if seasons else (int(re.findall(r'(19\\d{2}|20\\d{2})',path)[-1]) if re.findall(r'(19\\d{2}|20\\d{2})',path) else 0)")
          s=s.replace("rows=hist.get((norm(p['name']),p['season']),[])","classic_alias={'ronartest':'metta world peace','pennyhardaway':'anfernee hardaway'}; lookup=norm(classic_alias.get(norm(p['name']),p['name'])); rows=hist.get((lookup,p['season']),[])")
          s=s.replace('timeout=90','timeout=20')
          old="""pomaps={}\n for y in years:\n  try:pomaps[y]=historical_playoffs(y)\n  except Exception as e:print('WARN playoff',y,e);pomaps[y]={}"""
          new="""pomaps={}\n import time\n for y in years:\n  pomaps[y]={}\n  for attempt in range(3):\n   try:\n    pomaps[y]=historical_playoffs(y); break\n   except Exception as e:\n    print('WARN playoff',y,'attempt',attempt+1,e)\n    if attempt<2: time.sleep(1.5*(attempt+1))\n  time.sleep(.35)"""
          if old not in s: raise SystemExit('playoff patch target missing')
          s=s.replace(old,new); p.write_text(s)
          PY
          python per36-freeagents-classics.py
      - name: Validate
        run: |
          node --check season-free-agent-pool-v0.13.1.js
          python - <<'PY'
          import json,subprocess,statistics
          fa=json.load(open('stats-per36-free-agents.json')); cl=json.load(open('stats-per36-classics.json'))
          assert fa['count']==30 and len(cl['classicFiles'])>=18 and cl['count']>=80
          for f in cl['classicFiles']:subprocess.run(['node','--check',f],check=True)
          ps=fa['players']+cl['players']; assert all(p['new'][1]==p['old'][1] for p in ps)
          assert all(5<=v<=30 for p in ps for i,v in enumerate(p['new']) if i!=1)
          assert statistics.median(p['ratings']['scoring'] for p in cl['players'])>5
          for n in ['Michael Jordan','LeBron James','Allen Iverson']:
           h=[p for p in cl['players'] if p['name']==n]; assert h and max(p['ratings']['scoring'] for p in h)>=20,n
          assert cl['playoffMatches']>=0
          print({'freeAgents':fa['count'],'classicFiles':len(cl['classicFiles']),'classicEntries':cl['count'],'classicPlayoffMatches':cl['playoffMatches'],'classicMedianScoring':statistics.median(p['ratings']['scoring'] for p in cl['players'])})
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add per36-freeagents-classics.py season-free-agent-pool-v0.13.1.js classic-*.js stats-per36-free-agents.json stats-per36-classics.json PER36-FREE-AGENTS.md PER36-CLASSICS.md
          git commit -m "Apply Per36 model to free agents and classics"
          git push
