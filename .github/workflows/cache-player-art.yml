name: Cache Player Art

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-player-art.py'
      - '.github/workflows/cache-player-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch transparent player renders
        run: python scripts/fetch-player-art.py
      - name: Commit cached art
        run: |
          git config user.name "NBA Courtside Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/player-art
          if git diff --cached --quiet; then
            echo "No player-art changes"
            exit 0
          fi
          git commit -m "v0.4 cache production player renders [skip ci]"
          git push
