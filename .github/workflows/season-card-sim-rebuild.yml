name: Season card simulation rebuild
on:
  push:
    branches: [season-sim-audit-20260908]
    paths:
      - '.github/workflows/season-card-sim-rebuild.yml'
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: season-sim-audit-20260908}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Replace legacy overall season AI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('season-mode-v1.0.0.js')
          s=p.read_text()
          old="""  const overall=p=>{try{return typeof window.courtsideOverall==='function'?window.courtsideOverall(p):Math.round(CATS.reduce((n,k)=>n+(+p.stats?.[k]||0),0)/CATS.length)}catch{return 20}};\n  const strength=id=>{const r=teamPlayers(id);return r.length?r.reduce((n,p)=>n+overall(p),0)/r.length:20};"""
          new="""  const statValue=(p,k)=>Math.max(5,Math.min(30,Number(p?.stats?.[k])||5));\n  const teamPower=id=>{\n    const r=teamPlayers(id);if(r.length!==5)return 20;\n    let total=0;\n    for(const k of CATS){const vals=r.map(p=>statValue(p,k)).sort((a,b)=>b-a);total+=vals[0]*.34+vals[1]*.24+vals[2]*.18+vals[3]*.14+vals[4]*.10;}\n    return total/CATS.length;\n  };\n  function simulateCardGame(a,b){\n    const left=teamPlayers(a),right=teamPlayers(b);if(left.length!==5||right.length!==5)return Math.random()<.5?a:b;\n    const usedA=new Set(),usedB=new Set();let scoreA=0,scoreB=0;\n    const pick=(roster,used,k)=>{let best=null;for(const p of roster){if(used.has(p.id))continue;if(!best||statValue(p,k)>statValue(best,k))best=p;}return best;};\n    for(let q=0;q<4;q++){const k=CATS[Math.floor(Math.random()*CATS.length)],pa=pick(left,usedA,k),pb=pick(right,usedB,k);if(!pa||!pb)break;usedA.add(pa.id);usedB.add(pb.id);scoreA+=statValue(pa,k);scoreB+=statValue(pb,k);}\n    if(scoreA===scoreB){const pa=left.find(p=>!usedA.has(p.id)),pb=right.find(p=>!usedB.has(p.id)),k=CATS[Math.floor(Math.random()*CATS.length)];if(pa&&pb){scoreA+=statValue(pa,k);scoreB+=statValue(pb,k);}}\n    if(scoreA===scoreB){const pa=teamPower(a),pb=teamPower(b),p=.5+Math.max(-.12,Math.min(.12,(pa-pb)/40));return Math.random()<p?a:b;}\n    return scoreA>scoreB?a:b;\n  }"""
          if old not in s: raise SystemExit('legacy overall/strength block not found')
          s=s.replace(old,new)
          old2="  function simWinner(a,b){const sa=strength(a),sb=strength(b),p=Math.max(.2,Math.min(.8,.5+(sa-sb)/35));return Math.random()<p?a:b}"
          if old2 not in s: raise SystemExit('legacy simWinner not found')
          s=s.replace(old2,"  function simWinner(a,b){return simulateCardGame(a,b)}")
          s=s.replace("strength(b.id)-strength(a.id)","teamPower(b.id)-teamPower(a.id)")
          s=s.replace('/* NBA Starting5 v0.13.0-dev.3 — authentic 82-game Season adapter with no gameplay-function wrapping. */','/* NBA Starting5 v0.13.0-dev.4 — 82-game Season adapter with card-based CPU simulation. */')
          p.write_text(s)
          PY
      - name: Validate legacy removal
        run: |
          node --check season-mode-v1.0.0.js
          ! grep -q "courtsideOverall" season-mode-v1.0.0.js
          ! grep -q "(sa-sb)/35" season-mode-v1.0.0.js
          ! grep -q "const strength=" season-mode-v1.0.0.js
      - name: Run 10000 seasons with card simulator
        run: |
          cat > /tmp/sim.js <<'JS'
          const fs=require('fs'),vm=require('vm');
          const foundation=fs.readFileSync('foundation-v0.9.0.js','utf8');
          const fdMatch=foundation.match(/const FD=(\[[\s\S]*?\n\];)/);if(!fdMatch)throw new Error('FD not found');
          const ctx={};vm.createContext(ctx);vm.runInContext('FD='+fdMatch[1],ctx);const FD=ctx.FD;
          const cats=['scoring','dunks','three','rebounding','passing','blocks','steals'];
          const ids=FD.map(t=>t[1]);const teams=new Map(FD.map(t=>[t[1],{name:t[0],players:t[2].map((p,i)=>({id:t[1]+'-'+i,stats:Object.fromEntries(cats.map((k,j)=>[k,p[2][j]]))}))}]));
          function v(p,k){return Math.max(5,Math.min(30,Number(p.stats[k])||5))}
          function power(id){const r=teams.get(id).players;let total=0;for(const k of cats){const a=r.map(p=>v(p,k)).sort((x,y)=>y-x);total+=a[0]*.34+a[1]*.24+a[2]*.18+a[3]*.14+a[4]*.10}return total/cats.length}
          function game(a,b){const A=teams.get(a).players,B=teams.get(b).players,ua=new Set,ub=new Set;let sa=0,sb=0;const pick=(r,u,k)=>r.filter(p=>!u.has(p.id)).sort((x,y)=>v(y,k)-v(x,k))[0];for(let q=0;q<4;q++){const k=cats[Math.floor(Math.random()*cats.length)],pa=pick(A,ua,k),pb=pick(B,ub,k);ua.add(pa.id);ub.add(pb.id);sa+=v(pa,k);sb+=v(pb,k)}if(sa===sb){const pa=A.find(p=>!ua.has(p.id)),pb=B.find(p=>!ub.has(p.id)),k=cats[Math.floor(Math.random()*cats.length)];if(pa&&pb){sa+=v(pa,k);sb+=v(pb,k)}}if(sa===sb){const p=.5+Math.max(-.12,Math.min(.12,(power(a)-power(b))/40));return Math.random()<p?a:b}return sa>sb?a:b}
          const actual={ATL:46,BOS:56,BKN:20,CHA:44,CHI:31,CLE:52,DAL:26,DEN:54,DET:60,GSW:37,HOU:52,IND:19,LAC:42,LAL:53,MEM:25,MIA:43,MIL:32,MIN:49,NOP:26,NYK:53,OKC:64,ORL:45,PHI:45,PHX:45,POR:42,SAC:22,SAS:62,TOR:46,UTA:22,WAS:17};
          const abbr={ATL:'1610612737',BOS:'1610612738',BKN:'1610612751',CHA:'1610612766',CHI:'1610612741',CLE:'1610612739',DAL:'1610612742',DEN:'1610612743',DET:'1610612765',GSW:'1610612744',HOU:'1610612745',IND:'1610612754',LAC:'1610612746',LAL:'1610612747',MEM:'1610612763',MIA:'1610612748',MIL:'1610612749',MIN:'1610612750',NOP:'1610612740',NYK:'1610612752',OKC:'1610612760',ORL:'1610612753',PHI:'1610612755',PHX:'1610612756',POR:'1610612757',SAC:'1610612758',SAS:'1610612759',TOR:'1610612761',UTA:'1610612762',WAS:'1610612764'};const rev=Object.fromEntries(Object.entries(abbr).map(([a,id])=>[id,a]));
          const wins=Object.fromEntries(ids.map(id=>[id,0]));const N=10000;
          for(let s=0;s<N;s++){const rec=Object.fromEntries(ids.map(id=>[id,0]));for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=ids[i],b=ids[j];for(let n=0;n<3;n++)rec[game(a,b)]++}for(const id of ids){const target=82-(ids.length-1)*3;for(let n=0;n<target;n++){let b;do b=ids[Math.floor(Math.random()*ids.length)];while(b===id);rec[game(id,b)]++}wins[id]+=rec[id]}}
          const rows=ids.map(id=>({id,name:teams.get(id).name,power:power(id),sim:wins[id]/N,actual:actual[rev[id]]})).sort((a,b)=>b.sim-a.sim);const rankActual=[...rows].sort((a,b)=>b.actual-a.actual);const ar=Object.fromEntries(rankActual.map((r,i)=>[r.id,i+1]));let out='# NBA Starting5 — Card-Based Season Simulation Audit\n\n10,000 82-game seasons. No free-agent signings. CPU games use the same five cards, four random regulation categories, one-use-per-player, best-unused-player selection, and fifth-card overtime. No Overall-rating season AI remains.\n\n| Sim rk | Team | Card power | Sim W | Actual W | Δ W | Real rk | Δ rk |\n|---:|---|---:|---:|---:|---:|---:|---:|\n';rows.forEach((r,i)=>out+=`| ${i+1} | ${r.name} | ${r.power.toFixed(2)} | ${r.sim.toFixed(2)} | ${r.actual} | ${(r.sim-r.actual>=0?'+':'')+(r.sim-r.actual).toFixed(2)} | ${ar[r.id]} | ${(i+1-ar[r.id]>=0?'+':'')+(i+1-ar[r.id])} |\n`);out+='\n## Biggest absolute win outliers\n\n';[...rows].sort((a,b)=>Math.abs(b.sim-b.actual)-Math.abs(a.sim-a.actual)).slice(0,15).forEach(r=>out+=`- ${r.name}: ${r.sim.toFixed(2)} simulated vs ${r.actual} actual (${(r.sim-r.actual>=0?'+':'')+(r.sim-r.actual).toFixed(2)}), card power ${r.power.toFixed(2)}.\n`);const sas=rows.find(r=>r.name==='San Antonio Spurs');out+=`\n## Spurs\n\nSan Antonio card power ${sas.power.toFixed(2)}; ${sas.sim.toFixed(2)} simulated wins vs ${sas.actual} actual.\n`;fs.writeFileSync('SEASON-SIM-CARD-AUDIT-10000.md',out);console.log(out);
          JS
          node /tmp/sim.js
      - name: Commit rebuilt simulator and audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add season-mode-v1.0.0.js SEASON-SIM-CARD-AUDIT-10000.md
          git commit -m "Replace legacy season AI with card-based simulation"
          git push
