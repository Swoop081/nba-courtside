name: Audit Blocks Ratings
on:
  push:
    paths:
      - 'scripts/audit-blocks.py'
      - '.github/workflows/audit-blocks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 175-player Blocks audit and gameplay ratings
        run: python scripts/audit-blocks.py
      - name: Commit Blocks audit and gameplay output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocks-audit-v0.10.22.json blocks-ratings-v0.10.22.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "v0.10.22: publish approved Blocks ratings" && git push; fi
