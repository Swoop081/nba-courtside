name: Replace Four Classic Logos v0.10.80

on:
  push:
    paths:
      - '.github/workflows/replace-four-classic-logos-v0.10.80.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Download clean historical PNGs directly
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          from collections import deque

          root=Path('assets/team-logos/classic')
          root.mkdir(parents=True, exist_ok=True)
          targets={
            'sacramento-kings-2002-source-v6.png':'https://content.sportslogos.net/logos/6/240/full/832.png',
            'indiana-pacers-2000-source-v6.png':'https://content.sportslogos.net/logos/6/224/full/indiana-pacers-logo-primary-1991-2451.png',
            'houston-rockets-1995-source-v6.png':'https://content.sportslogos.net/logos/6/230/full/eigv3ra8cjkojrywrgcvy6z29.png',
            'san-antonio-spurs-2005-source-v6.png':'https://content.sportslogos.net/logos/6/233/full/827.png',
          }
          sess=requests.Session(); sess.headers.update({'User-Agent':'Mozilla/5.0'})
          for outname,url in targets.items():
            r=sess.get(url,timeout=30); print(outname, r.status_code, r.headers.get('content-type'), len(r.content))
            r.raise_for_status()
            im=Image.open(BytesIO(r.content)).convert('RGBA'); px=im.load(); w,h=im.size
            # Remove only an edge-connected pale matte if the downloaded PNG contains one.
            def pale(c):
              rr,gg,bb,a=c
              return a>0 and max(rr,gg,bb)-min(rr,gg,bb)<=45 and (rr+gg+bb)/3>=205
            q=deque()
            for x in range(w): q.extend(((x,0),(x,h-1)))
            for y in range(h): q.extend(((0,y),(w-1,y)))
            seen=set()
            while q:
              x,y=q.popleft()
              if x<0 or y<0 or x>=w or y>=h or (x,y) in seen: continue
              seen.add((x,y)); c=px[x,y]
              if c[3]==0:
                q.extend(((x+1,y),(x-1,y),(x,y+1),(x,y-1))); continue
              if not pale(c): continue
              px[x,y]=(c[0],c[1],c[2],0)
              q.extend(((x+1,y),(x-1,y),(x,y+1),(x,y-1)))
            lo,hi=im.getchannel('A').getextrema()
            print('alpha',lo,hi,'size',im.size)
            if lo==255: raise RuntimeError(outname+' has no transparency')
            im.save(root/outname,'PNG',optimize=True)
          PY
      - name: Commit clean source logos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/team-logos/classic/*-source-v6.png
          git commit -m 'Replace four Classic logos with clean historical source PNGs v0.10.80'
          git pull --rebase origin main
          git push origin HEAD:main
