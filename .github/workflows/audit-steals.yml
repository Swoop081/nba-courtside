name: Audit Steals Ratings
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-steals.py'
      - '.github/workflows/audit-steals.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 175-player Steals audit
        run: python scripts/audit-steals.py
      - name: Commit Steals audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steals-audit-v0.10.23.json
          git diff --cached --quiet || git commit -m "v0.10.23: generate 175-player Steals audit"
          git push