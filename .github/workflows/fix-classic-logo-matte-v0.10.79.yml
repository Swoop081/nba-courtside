name: Fix Classic Logo Matte v0.10.79

on:
  push:
    paths:
      - '.github/workflows/fix-classic-logo-matte-v0.10.79.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-problem-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Remove white and checkerboard mattes from four Classic logos
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          from collections import deque
          from math import sqrt

          files=[
            'sacramento-kings-2002-alpha-v4.png',
            'indiana-pacers-2000-alpha-v4.png',
            'houston-rockets-1995-alpha-v4.png',
            'san-antonio-spurs-2005-alpha-v4.png',
          ]
          root=Path('assets/team-logos/classic')

          for name in files:
            src=root/name
            out=root/name.replace('-alpha-v4.png','-alpha-v5.png')
            im=Image.open(src).convert('RGBA')
            px=im.load(); w,h=im.size
            opaque=[(x,y) for y in range(h) for x in range(w) if px[x,y][3] > 8]
            if not opaque:
              im.save(out,'PNG',optimize=True)
              continue

            xs=[x for x,y in opaque]; ys=[y for x,y in opaque]
            x0,x1=min(xs),max(xs); y0,y1=min(ys),max(ys)

            perimeter=[]
            for x in range(x0,x1+1):
              perimeter += [px[x,y0], px[x,y1]]
            for y in range(y0,y1+1):
              perimeter += [px[x0,y], px[x1,y]]

            def light_neutral(c):
              r,g,b,a=c
              if a <= 8: return True
              return (max(r,g,b)-min(r,g,b) <= 92 and (r+g+b)/3 >= 135)

            seeds=[c[:3] for c in perimeter if c[3] > 8 and light_neutral(c)]
            # Deduplicate seed palette to keep distance checks cheap.
            palette=[]
            for c in seeds:
              if not any(sum((c[i]-p[i])**2 for i in range(3)) < 32**2 for p in palette):
                palette.append(c)
            palette=palette[:16]

            def bg_like(c):
              r,g,b,a=c
              if a <= 8: return True
              if light_neutral(c): return True
              return any((r-pr)**2+(g-pg)**2+(b-pb)**2 <= 78**2 for pr,pg,pb in palette)

            q=deque()
            for x in range(x0,x1+1): q.extend(((x,y0),(x,y1)))
            for y in range(y0,y1+1): q.extend(((x0,y),(x1,y)))
            seen=set(); removed=0
            while q:
              x,y=q.popleft()
              if x<x0 or y<y0 or x>x1 or y>y1 or (x,y) in seen: continue
              seen.add((x,y))
              if not bg_like(px[x,y]): continue
              r,g,b,a=px[x,y]
              if a>0:
                px[x,y]=(r,g,b,0); removed+=1
              q.extend(((x+1,y),(x-1,y),(x,y+1),(x,y-1)))

            # Remove anti-aliased pale fringe touching transparency.
            for _ in range(5):
              kill=[]
              for y in range(max(1,y0),min(h-1,y1+1)):
                for x in range(max(1,x0),min(w-1,x1+1)):
                  r,g,b,a=px[x,y]
                  if a==0: continue
                  if max(r,g,b)-min(r,g,b) > 100 or (r+g+b)/3 < 125: continue
                  if any(px[nx,ny][3]==0 for nx,ny in ((x+1,y),(x-1,y),(x,y+1),(x,y-1))):
                    kill.append((x,y))
              if not kill: break
              for x,y in kill:
                r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0); removed+=1

            im.save(out,'PNG',optimize=True)
            print(name,'palette',palette,'removed',removed,'->',out.name)
          PY
      - name: Commit v5 transparent logos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/team-logos/classic/*-alpha-v5.png
          git commit -m 'Remove residual Classic logo mattes v0.10.79'
          git pull --rebase origin main
          git push origin HEAD:main
