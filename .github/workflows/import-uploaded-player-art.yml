name: Import uploaded player art

on:
  push:
    paths:
      - 'art-import/READY'

permissions:
  contents: write

jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode uploaded player art bundle
        shell: python
        run: |
          import base64, io, zipfile
          from pathlib import Path
          bundle = Path('art-import/player-art-v0.8.7.zip.b64')
          out = Path('assets/player-art')
          out.mkdir(parents=True, exist_ok=True)
          payload = base64.b64decode(bundle.read_text().strip())
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              for info in z.infolist():
                  if not info.filename.endswith('.webp'):
                      continue
                  target = out / Path(info.filename).name
                  target.write_bytes(z.read(info))
                  print('wrote', target, target.stat().st_size)
      - name: Commit decoded artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-art/*.web
          git add assets/player-art/*.webp
          if git diff --cached --quiet; then
            echo "No art changes"
            exit 0
          fi
          git commit -m "v0.8.7 import uploaded Tip-Off 27 player art"
          git push
