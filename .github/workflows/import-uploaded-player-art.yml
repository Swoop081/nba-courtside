name: Import uploaded player art

on:
  push:
    paths:
      - 'art-import/READY'

permissions:
  contents: write

jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode player art chunks
        shell: python
        run: |
          import base64
          from pathlib import Path
          source = Path('art-import/chunks')
          out = Path('assets/player-art')
          out.mkdir(parents=True, exist_ok=True)
          slugs = sorted({p.name.split('.part')[0] for p in source.glob('*.part*.txt')})
          for slug in slugs:
              parts = sorted(source.glob(f'{slug}.part*.txt'))
              payload = ''.join(p.read_text().strip() for p in parts)
              target = out / f'{slug}.webp'
              target.write_bytes(base64.b64decode(payload))
              print('wrote', target, target.stat().st_size, 'from', len(parts), 'parts')
      - name: Commit decoded artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-art/*.webp
          if git diff --cached --quiet; then
            echo "No art changes"
            exit 0
          fi
          git commit -m "v0.8.7 import uploaded Tip-Off 27 player art"
          git push
