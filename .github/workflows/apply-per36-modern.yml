name: Apply Modern Per36 Calibration
on:
  push:
    branches: [per36-modern-calibration-final]
    paths: [.github/workflows/apply-per36-modern.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply verified Per36 calibration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: per36-modern-calibration-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate ratings, classic template, and update modern players
        run: |
          python - <<'PY'
          import json, math, re
          from pathlib import Path
          RAW={
          'derrick-white':['Derrick White',17.4,4.6,5.7,2.9,1.2,1.3],
          'michael-porter-jr':['Michael Porter Jr.',26.8,7.8,3.4,3.8,1.2,0.3],
          'josh-hart':['Josh Hart',11.6,10.0,5.1,1.6,1.9,0.2],
          'vj-edgecombe':['VJ Edgecombe',16.5,5.8,4.3,2.0,1.5,0.5],
          'jakobe-walter':["Ja'Kobe Walter",13.2,4.5,2.1,2.7,1.8,0.3],
          'josh-giddey':['Josh Giddey',19.1,9.3,10.3,2.1,1.1,0.6],
          'jarrett-allen':['Jarrett Allen',20.4,11.3,2.4,0.0,1.3,1.1],
          'cade-cunningham':['Cade Cunningham',25.4,5.9,10.5,2.1,1.5,0.9],
          'obi-toppin':['Obi Toppin',23.7,9.0,4.7,3.1,1.0,0.1],
          'kyle-kuzma':['Kyle Kuzma',17.9,6.2,3.7,1.7,0.9,0.6],
          'jalen-johnson':['Jalen Johnson',23.0,10.5,8.0,1.7,1.3,0.4],
          'kon-knueppel':['Kon Knueppel',21.1,6.1,3.9,3.9,0.8,0.3],
          'bam-adebayo':['Bam Adebayo',22.3,11.1,3.5,1.9,1.3,0.7],
          'jalen-suggs':['Jalen Suggs',18.0,5.0,7.1,2.8,2.4,0.9],
          'bub-carrington':['Bub Carrington',13.9,4.4,6.0,2.7,0.8,0.3],
          'nikola-jokic':['Nikola Jokić',28.6,13.3,11.1,1.8,1.5,0.8],
          'rudy-gobert':['Rudy Gobert',12.5,13.2,1.9,0.0,0.9,1.9],
          'shai-gilgeous-alexander':['Shai Gilgeous-Alexander',33.7,4.7,7.1,1.8,1.5,0.8],
          'scoot-henderson':['Scoot Henderson',20.6,3.9,5.4,2.7,1.3,0.4],
          'keyonte-george':['Keyonte George',25.7,4.0,6.7,2.7,1.2,0.3],
          'brandin-podziemski':['Brandin Podziemski',17.5,6.5,4.7,2.4,1.4,0.2],
          'brook-lopez':['Brook Lopez',14.0,6.0,2.1,2.5,1.0,1.9],
          'luka-doncic':['Luka Dončić',33.7,7.8,8.3,4.0,1.7,0.5],
          'dillon-brooks':['Dillon Brooks',23.9,4.3,2.1,2.7,1.2,0.2],
          'zach-lavine':['Zach LaVine',22.0,3.2,2.6,2.9,0.8,0.3],
          'cooper-flagg':['Cooper Flagg',22.6,7.2,4.9,1.1,1.3,1.0],
          'reed-sheppard':['Reed Sheppard',18.6,4.0,4.6,3.8,2.0,0.9],
          'gg-jackson':['GG Jackson',21.0,7.2,2.5,2.0,0.9,1.3],
          'jeremiah-fears':['Jeremiah Fears',19.9,5.1,4.8,1.7,1.7,0.5],
          'victor-wembanyama':['Victor Wembanyama',30.9,14.2,3.8,2.4,1.3,3.8]
          }
          ORDER=['scoring','rebounding','passing','three','steals','blocks']
          SLOT={'scoring':0,'rebounding':1,'passing':2,'three':3,'steals':5,'blocks':6}
          LABEL={'scoring':'PTS/36','rebounding':'TRB/36','passing':'AST/36','three':'3PM/36','steals':'STL/36','blocks':'BLK/36'}
          data={slug:{'name':row[0],'per36':dict(zip(ORDER,row[1:]))} for slug,row in RAW.items()}
          def round_half_up(x): return int(math.floor(x+0.5))
          def rate(x,lo,mid,hi):
            y=(5+(x-lo)/(mid-lo)*10) if x<=mid else (15+(x-mid)/(hi-mid)*15)
            return max(5,min(30,round_half_up(y)))
          anchors={}
          for stat in ORDER:
            vals=[p['per36'][stat] for p in data.values()]
            lo,hi=min(vals),max(vals); mid=(lo+hi)/2
            template={}
            for rating in range(5,31):
              x=lo+(rating-5)/10*(mid-lo) if rating<=15 else mid+(rating-15)/15*(hi-mid)
              template[str(rating)]=round(x,3)
            anchors[stat]={'min_per36':round(lo,3),'rating_at_min':5,'mid_per36':round(mid,3),'rating_at_mid':15,'max_per36':round(hi,3),'rating_at_max':30,'rating_template_per36':template}
            for p in data.values(): p.setdefault('ratings',{})[stat]=rate(p['per36'][stat],lo,mid,hi)
          app=Path('app.js'); text=app.read_text(); original={}
          for slug in RAW:
            pat=re.compile(r"\[([0-9]+(?:,[0-9]+){7})\],'"+re.escape(slug)+r"'")
            m=pat.search(text)
            if not m: raise RuntimeError('RAW_PLAYERS entry not found: '+slug)
            old=list(map(int,m.group(1).split(','))); original[slug]=(old[4],old[7]); new=old[:]
            for stat in ORDER: new[SLOT[stat]]=data[slug]['ratings'][stat]
            repl='['+','.join(map(str,new))+"],'"+slug+"'"
            text=text[:m.start()]+repl+text[m.end():]
          app.write_text(text)
          check=app.read_text()
          for slug,(dunk,ft) in original.items():
            m=re.search(r"\[([0-9]+(?:,[0-9]+){7})\],'"+re.escape(slug)+r"'",check); vals=list(map(int,m.group(1).split(',')))
            assert vals[4]==dunk and vals[7]==ft, f'Non-Per36 stat changed for {slug}'
          for stat in ORDER:
            vals=[(p['per36'][stat],p['ratings'][stat]) for p in data.values()]
            assert min(vals,key=lambda x:x[0])[1]==5 and max(vals,key=lambda x:x[0])[1]==30
            a=anchors[stat]; assert rate(a['mid_per36'],a['min_per36'],a['mid_per36'],a['max_per36'])==15
          assert len(data)==30 and all(5<=r<=30 for p in data.values() for r in p['ratings'].values())
          payload={'schema':'nba-starting5-per36-calibration-v1','source':{'provider':'Basketball-Reference','url':'https://www.basketball-reference.com/leagues/NBA_2026_per_minute.html','season':'2025-26','table':'Per 36 Minutes','retrieved_for_calibration':'2026-09-08'},'population':'30 current NBA Starting5 modern team representatives','categories':{k:LABEL[k] for k in ORDER},'formula':{'floor_rating':5,'mid_rating':15,'ceiling_rating':30,'midpoint_definition':'(population minimum + population maximum) / 2','lower_segment':'5 + (x-min)/(mid-min)*10','upper_segment':'15 + (x-mid)/(max-mid)*15','rounding':'nearest integer, half up','clamp':'5..30'},'anchors':anchors,'players':data}
          Path('stats-per36-current-v0.13.0.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          lines=['# NBA Starting5 Per-36 Rating Template','','Source: Basketball-Reference 2025-26 regular-season Per 36 Minutes.','','Calibration population: the 30 current NBA Starting5 modern team representatives. Observed minimum = rating 5; arithmetic midpoint of the observed min/max range = rating 15; observed maximum = rating 30. Values between anchors use piecewise linear interpolation, nearest-integer half-up rounding, and a 5–30 clamp.','','Dunking and Free Throws are intentionally outside this Per-36 calibration.','']
          for stat in ORDER:
            a=anchors[stat]; lines += ['## '+LABEL[stat],'',f"5 = {a['min_per36']:.3f} | 15 = {a['mid_per36']:.3f} | 30 = {a['max_per36']:.3f}",'','| Rating | Per-36 benchmark |','|---:|---:|']
            lines += [f"| {rating} | {a['rating_template_per36'][str(rating)]:.3f} |" for rating in range(5,31)]+['']
          Path('PER36-RATING-TEMPLATE.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps({k:{'5':v['min_per36'],'15':v['mid_per36'],'30':v['max_per36']} for k,v in anchors.items()},indent=2))
          PY
      - name: Commit calibration and clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js stats-per36-current-v0.13.0.json PER36-RATING-TEMPLATE.md
          git commit -m 'Calibrate six modern categories from Basketball-Reference Per36'
          DATA_SHA=$(git rev-parse HEAD)
          python - <<PY
          import json
          b=json.load(open('build.json')); b.update(version='0.13.0-dev.20',build='20260908-1630',commit='${DATA_SHA}',channel='per36-modern-calibration'); open('build.json','w').write(json.dumps(b,separators=(',',':'))+'\n')
          PY
          git rm .github/workflows/apply-per36-modern.yml
          git add build.json
          git commit -m 'Bump build for Per36 modern calibration'
          git push origin HEAD:per36-modern-calibration-final
