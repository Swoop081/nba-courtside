name: Audit Overall Ratings
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-overall.py'
      - '.github/workflows/audit-overall.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 175-player Overall audit
        run: python scripts/audit-overall.py
      - name: Commit Overall audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overall-audit-v0.10.26.json
          git diff --cached --quiet || git commit -m "v0.10.26: generate 175-player Overall hierarchy audit"
          git push
