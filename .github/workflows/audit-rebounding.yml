name: Audit Rebounding Ratings
on:
  push:
    paths:
      - 'scripts/audit-rebounding.py'
      - '.github/workflows/audit-rebounding.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 175-player rebounding audit
        run: python scripts/audit-rebounding.py
      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebounding-audit-v0.10.21.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "v0.10.21: generate 175-player rebounding audit" && git push; fi
