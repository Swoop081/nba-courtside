name: Audit Dunking Ratings
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-dunking.py'
      - '.github/workflows/audit-dunking.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 175-player subjective Dunking audit
        run: python scripts/audit-dunking.py
      - name: Commit Dunking audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dunking-audit-v0.10.25.json
          git diff --cached --quiet || git commit -m "v0.10.25: generate subjective 175-player Dunking audit"
          git push