name: Per36 150-player audit

on:
  push:
    paths:
      - '.github/workflows/per36-150-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 150-player calibration audit from 2025-26 NBA data
        run: |
          curl --fail --location --retry 3 --output /tmp/nba-2025-26.csv \
            https://raw.githubusercontent.com/EasySportsApps/nba_api_25_26_data/main/nba_players_regular_season_25_26_wide_data.csv
          python - <<'PY'
          import csv, json, math, re, unicodedata

          FIVES={
            'MIL':['Ryan Rollins','Tyler Herro','Jaime Jaquez Jr.','Kyle Kuzma','Myles Turner'],
            'BKN':['Mikel Brown Jr.','Egor Demin','Michael Porter Jr.','Julius Randle',"Day'Ron Sharpe"],
            'SAC':['Malik Monk','Zach LaVine',"De'Andre Hunter",'Keegan Murray','Domantas Sabonis'],
            'MEM':['Ty Jerome','Jaylen Wells','Cedric Coward','Jerami Grant','Zach Edey'],
            'CHI':['Josh Giddey','Norman Powell','Matas Buzelis','Patrick Williams','Nic Claxton'],
            'CHA':['Coby White','Kon Knueppel','Brandon Miller','Naz Reid','Moussa Diabate'],
            'LAC':['Darius Garland','Kris Dunn','Brandon Ingram','Rui Hachimura','Brook Lopez'],
            'DAL':['Kyrie Irving','Max Christie','Cooper Flagg','P.J. Washington','Dereck Lively II'],
            'WAS':['Trae Young','Kyshawn George','Tre Johnson','Anthony Davis','Alex Sarr'],
            'NOP':['Dejounte Murray','Trey Murphy III','Herb Jones','Zion Williamson','Derik Queen'],
            'PHX':['Devin Booker','Jalen Green','Dillon Brooks','Miles Bridges','Mark Williams'],
            'GSW':['Stephen Curry','Brandin Podziemski','Moses Moody','Draymond Green','Kristaps Porzingis'],
            'ORL':['Jalen Suggs','Desmond Bane','Franz Wagner','Paolo Banchero','Wendell Carter Jr.'],
            'POR':['Ja Morant','Damian Lillard','Toumani Camara','Deni Avdija','Donovan Clingan'],
            'LAL':['Luka Doncic','Austin Reaves','Quentin Grimes','Sandro Mamukelashvili','Walker Kessler'],
            'UTA':['Keyonte George','Ace Bailey','Lauri Markkanen','Jaren Jackson Jr.','Jusuf Nurkic'],
            'MIA':['Davion Mitchell','Tim Hardaway Jr.','Andrew Wiggins','Giannis Antetokounmpo','Bam Adebayo'],
            'DET':['Cade Cunningham','Ausar Thompson','Duncan Robinson','John Collins','Jalen Duren'],
            'MIN':['LaMelo Ball','Anthony Edwards','Ayo Dosunmu','Jaden McDaniels','Rudy Gobert'],
            'BOS':['Payton Pritchard','Derrick White','Paul George','Jayson Tatum','Mitchell Robinson'],
            'TOR':['Immanuel Quickley','RJ Barrett','Kawhi Leonard','Scottie Barnes','Jakob Poeltl'],
            'HOU':['Fred VanVleet','Amen Thompson','Kevin Durant','Jabari Smith Jr.','Alperen Sengun'],
            'ATL':['CJ McCollum','Nickeil Alexander-Walker','Dyson Daniels','Jalen Johnson','Onyeka Okongwu'],
            'CLE':['James Harden','Donovan Mitchell','Max Strus','Evan Mobley','Jarrett Allen'],
            'SAS':["De'Aaron Fox",'Stephon Castle','Devin Vassell','Julian Champagnie','Victor Wembanyama'],
            'DEN':['Jamal Murray','Christian Braun','Cameron Johnson','Aaron Gordon','Nikola Jokic'],
            'IND':['Tyrese Haliburton','Andrew Nembhard','Aaron Nesmith','Pascal Siakam','Ivica Zubac'],
            'NYK':['Jalen Brunson','Josh Hart','Mikal Bridges','OG Anunoby','Karl-Anthony Towns'],
            'OKC':['Shai Gilgeous-Alexander','Cason Wallace','Jalen Williams','Chet Holmgren','Isaiah Hartenstein'],
            'PHI':['Tyrese Maxey','VJ Edgecombe','Jaylen Brown','LeBron James','Joel Embiid'],
          }
          assert len(FIVES)==30 and sum(map(len,FIVES.values()))==150

          def norm(s):
            s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
            s=re.sub(r'\b(jr|sr|ii|iii|iv)\b','',s)
            return re.sub(r'[^a-z0-9]','',s)

          with open('/tmp/nba-2025-26.csv',encoding='utf-8-sig',newline='') as f:
            rows=list(csv.DictReader(f))
          bynorm={norm(r['player_name']):r for r in rows}

          def per36(row):
            m=float(row['minutes_played'])
            if m<=0: raise ValueError('zero minutes')
            one=float(row['one_point_made']); two=float(row['two_point_made']); three=float(row['three_point_made'])
            return {
              'scoring':(one+2*two+3*three)/m*36,
              'rebounding':(float(row['offensive_rebounds'])+float(row['defensive_rebounds']))/m*36,
              'passing':float(row['assists'])/m*36,
              'three':three/m*36,
              'steals':float(row['steals'])/m*36,
              'blocks':float(row['blocks'])/m*36,
            }

          selected=[]; missing=[]
          for team,names in FIVES.items():
            for pos,name in enumerate(names):
              key=norm(name); row=bynorm.get(key)
              if row is None:
                cand=[r for k,r in bynorm.items() if k==key or k.startswith(key) or key.startswith(k)]
                row=cand[0] if len(cand)==1 else None
              if row is None:
                missing.append({'team':team,'name':name,'norm':key}); continue
              selected.append({
                'team':team,'name':name,'positionIndex':pos,'nbaPlayerId':row['player_id'],
                'sourceName':row['player_name'],'sourceTeam2025_26':row['team'],
                'minutes2025_26':round(float(row['minutes_played']),3),
                'raw':{k:round(v,4) for k,v in per36(row).items()}
              })
          if missing:
            print('MISSING:',json.dumps(missing,indent=2,ensure_ascii=False))
            raise SystemExit(f'{len(missing)} selected players not found')
          assert len(selected)==150

          cats=['scoring','rebounding','passing','three','steals','blocks']
          anchors={}
          for cat in cats:
            vals=[p['raw'][cat] for p in selected]
            lo=min(vals); hi=max(vals); mid=(lo+hi)/2
            anchors[cat]={'rating5':round(lo,3),'rating15':round(mid,3),'rating30':round(hi,3)}

          def half_up(x): return int(math.floor(x+0.5))
          def rate(x,a):
            lo=a['rating5']; mid=a['rating15']; hi=a['rating30']
            if x<=mid: y=5+(x-lo)/(mid-lo)*10 if mid>lo else 15
            else: y=15+(x-mid)/(hi-mid)*15 if hi>mid else 30
            return max(5,min(30,half_up(y)))

          dist={c:{str(n):0 for n in range(5,31)} for c in cats}
          top5={}
          for p in selected:
            p['ratings']={}
            for c in cats:
              r=rate(p['raw'][c],anchors[c]); p['ratings'][c]=r; dist[c][str(r)]+=1
          for c in cats:
            top5[c]=[{'name':p['name'],'team':p['team'],'raw':p['raw'][c],'rating':p['ratings'][c]} for p in sorted(selected,key=lambda p:(p['ratings'][c],p['raw'][c]),reverse=True)[:5]]

          out={
            'schema':'nba-starting5-per36-calibration-150-v1',
            'generatedFrom':'2025-26 NBA regular-season totals exported from the official NBA Stats API; converted to Per36',
            'population':150,'teamCount':30,
            'selectionNote':'30 current 2026-27 representative fives. Six projected 2026 rookies without a 2025-26 NBA sample were replaced by current-roster alternatives with NBA data for this calibration audit.',
            'substitutions':[
              {'team':'SAC','projected':'Darius Acuff Jr.','auditPlayer':'Malik Monk'},
              {'team':'MEM','projected':'Cameron Boozer','auditPlayer':'Jerami Grant'},
              {'team':'CHI','projected':'Caleb Wilson','auditPlayer':'Patrick Williams'},
              {'team':'GSW','projected':'Yaxel Lendeborg','auditPlayer':'Moses Moody'},
              {'team':'WAS','projected':'AJ Dybantsa','auditPlayer':'Tre Johnson'},
              {'team':'UTA','projected':'Darryn Peterson','auditPlayer':'Ace Bailey'}],
            'formula':{'rating5':'population minimum','rating15':'arithmetic midpoint of population min/max','rating30':'population maximum','interpolation':'piecewise linear, half-up rounding, clamp 5..30'},
            'anchors':anchors,'distribution':dist,'top5':top5,'players':selected}
          with open('stats-per36-current-150-audit.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)

          labels={'scoring':'Scoring PTS/36','rebounding':'Rebounding REB/36','passing':'Passing AST/36','three':'3PM/36','steals':'STL/36','blocks':'BLK/36'}
          lines=['# NBA Starting5 — 150-player Per-36 calibration audit','',
                 'Population: 30 current 2026–27 representative fives = 150 players.','',
                 'Source: 2025–26 NBA regular-season totals exported from the official NBA Stats API, converted to Per 36.','',
                 'Six projected 2026 rookies without a 2025–26 NBA sample were replaced by current-roster alternatives with NBA data for this calibration audit.','',
                 '## Anchors','', '| Category | Rating 5 | Rating 15 | Rating 30 |','|---|---:|---:|---:|---:|']
          for c in cats:
            a=anchors[c]; lines.append(f"| {labels[c]} | {a['rating5']:.3f} | {a['rating15']:.3f} | {a['rating30']:.3f} |")
          lines += ['', '## Top five by category','']
          for c in cats:
            lines.append(f"### {labels[c]}")
            for i,p in enumerate(top5[c],1): lines.append(f"{i}. {p['name']} ({p['team']}) — {p['raw']:.2f} raw → {p['rating']}")
            lines.append('')
          lines += ['## Rating distribution','', '| Rating | SCO | REB | PAS | 3PT | STL | BLK |','|---:|---:|---:|---:|---:|---:|---:|']
          for n in range(5,31): lines.append('| '+str(n)+' | '+' | '.join(str(dist[c][str(n)]) for c in cats)+' |')
          with open('PER36-150-AUDIT.md','w',encoding='utf-8') as f: f.write('\n'.join(lines)+'\n')
          print(json.dumps({'anchors':anchors,'top5':top5,'distribution':dist},indent=2,ensure_ascii=False))
          PY
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stats-per36-current-150-audit.json PER36-150-AUDIT.md
          git commit -m "Build 150-player Per36 calibration audit"
          git push
