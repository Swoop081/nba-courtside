name: Young-player trajectory ratings pass
on:
  push:
    branches: [season-sim-audit-20260908]
    paths: ['.github/workflows/season-young-trajectory-pass.yml']
permissions:
  contents: write
jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: season-sim-audit-20260908}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply visible young-player trajectory ratings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('foundation-v0.9.0.js')
          s=p.read_text()
          repl={
          "['Dyson Daniels','SF',[18,22,16,22,24,10,30]]":"['Dyson Daniels','SF',[20,23,18,23,25,11,30]]",
          "['Jalen Johnson','PF',[25,29,20,27,24,18,18]]":"['Jalen Johnson','PF',[26,30,21,28,25,19,19]]",
          "['Brandon Miller','SG',[24,23,26,15,16,8,15]]":"['Brandon Miller','SG',[26,24,27,16,18,9,16]]",
          "['Matas Buzelis','SF',[20,27,18,18,13,16,10]]":"['Matas Buzelis','SF',[22,28,20,20,15,17,12]]",
          "['Caleb Wilson','PF',[18,28,14,22,11,18,9]]":"['Caleb Wilson','PF',[21,29,17,24,14,20,12]]",
          "['Peyton Watson','SF',[17,26,17,17,9,24,16]]":"['Peyton Watson','SF',[19,27,19,19,11,25,18]]",
          "['Ausar Thompson','SF',[19,30,10,24,17,20,25]]":"['Ausar Thompson','SF',[21,30,13,25,19,21,27]]",
          "['Jalen Duren','C',[20,29,1,29,9,22,11]]":"['Jalen Duren','C',[22,30,3,30,11,24,13]]",
          "['Brandin Podziemski','SG',[20,13,23,18,18,4,14]]":"['Brandin Podziemski','SG',[22,15,25,20,20,5,16]]",
          "['Amen Thompson','SG',[22,30,10,26,22,21,27]]":"['Amen Thompson','SG',[24,30,13,27,24,22,28]]",
          "['Jabari Smith Jr.','PF',[20,24,24,23,10,19,12]]":"['Jabari Smith Jr.','PF',[22,25,25,24,12,20,14]]",
          "['Keaton Wagler','SG',[17,16,20,10,16,5,13]]":"['Keaton Wagler','SG',[19,18,22,12,18,6,15]]",
          "['Cameron Boozer','PF',[21,27,16,25,16,18,11]]":"['Cameron Boozer','PF',[23,28,18,27,18,20,13]]",
          "['Zach Edey','C',[18,28,1,30,7,29,7]]":"['Zach Edey','C',[20,29,3,30,9,30,9]]",
          "['Cason Wallace','SG',[18,13,23,10,15,6,27]]":"['Cason Wallace','SG',[20,15,25,12,17,8,28]]",
          "['Chet Holmgren','PF',[24,27,26,27,14,30,13]]":"['Chet Holmgren','PF',[25,28,27,28,16,30,15]]",
          "['Paolo Banchero','PF',[28,28,20,25,22,11,13]]":"['Paolo Banchero','PF',[29,29,22,26,24,13,15]]",
          "['Donovan Clingan','C',[16,27,2,29,7,28,8]]":"['Donovan Clingan','C',[18,28,4,30,9,29,10]]",
          "['Darius Acuff Jr.','PG',[19,17,21,8,23,2,12]]":"['Darius Acuff Jr.','PG',[21,19,23,10,25,3,14]]",
          "['Darryn Peterson','SG',[23,25,23,14,20,8,16]]":"['Darryn Peterson','SG',[25,27,25,16,22,10,18]]",
          "['Keyonte George','PG',[24,12,26,9,24,2,11]]":"['Keyonte George','PG',[26,13,27,10,26,3,13]]",
          "['AJ Dybantsa','SF',[24,29,21,22,18,17,18]]":"['AJ Dybantsa','SF',[26,30,23,24,20,19,20]]",
          "['Alex Sarr','C',[21,25,20,25,10,29,11]]":"['Alex Sarr','C',[23,26,22,26,12,30,13]]"
          }
          missing=[]
          for a,b in repl.items():
            if a not in s: missing.append(a)
            else: s=s.replace(a,b)
          if missing: raise SystemExit('Missing expected rows:\n'+'\n'.join(missing))
          p.write_text(s)
          PY
          node --check foundation-v0.9.0.js
      - name: Run 10000 season audit
        run: |
          cat > /tmp/sim.js <<'JS'
          const fs=require('fs'),vm=require('vm');
          const txt=fs.readFileSync('foundation-v0.9.0.js','utf8');
          const m=txt.match(/const FD=(\[[\s\S]*?\n\];)/);if(!m)throw Error('FD');
          const c={};vm.createContext(c);vm.runInContext('FD='+m[1],c);const FD=c.FD;
          const cats=['scoring','dunks','three','rebounding','passing','blocks','steals'];
          const ids=FD.map(t=>t[1]), teams=new Map(FD.map(t=>[t[1],{name:t[0],players:t[2].map((p,i)=>({id:t[1]+'-'+i,stats:Object.fromEntries(cats.map((k,j)=>[k,p[2][j]]))}))}]));
          const v=(p,k)=>Math.max(5,Math.min(30,+p.stats[k]||5));
          function power(id){let z=0;for(const k of cats){const a=teams.get(id).players.map(p=>v(p,k)).sort((x,y)=>y-x);z+=a[0]*.34+a[1]*.24+a[2]*.18+a[3]*.14+a[4]*.10}return z/7}
          function game(a,b){const A=teams.get(a).players,B=teams.get(b).players,ua=new Set,ub=new Set;let sa=0,sb=0;const pick=(r,u,k)=>r.filter(p=>!u.has(p.id)).sort((x,y)=>v(y,k)-v(x,k))[0];for(let q=0;q<4;q++){const k=cats[Math.floor(Math.random()*7)],pa=pick(A,ua,k),pb=pick(B,ub,k);ua.add(pa.id);ub.add(pb.id);sa+=v(pa,k);sb+=v(pb,k)}if(sa===sb){const pa=A.find(p=>!ua.has(p.id)),pb=B.find(p=>!ub.has(p.id)),k=cats[Math.floor(Math.random()*7)];sa+=v(pa,k);sb+=v(pb,k)}if(sa===sb){const p=.5+Math.max(-.12,Math.min(.12,(power(a)-power(b))/40));return Math.random()<p?a:b}return sa>sb?a:b}
          const wins=Object.fromEntries(ids.map(id=>[id,0])),N=10000;
          for(let s=0;s<N;s++){const rec=Object.fromEntries(ids.map(id=>[id,0]));for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)for(let n=0;n<3;n++)rec[game(ids[i],ids[j])]++;for(const id of ids){for(let n=0;n<82-87;n++){let b;do b=ids[Math.floor(Math.random()*ids.length)];while(b===id);rec[game(id,b)]++}wins[id]+=rec[id]}}
          const rows=ids.map(id=>({name:teams.get(id).name,p:power(id),w:wins[id]/N})).sort((a,b)=>b.w-a.w);
          let out='# NBA Starting5 — Young-Player Trajectory 10,000 Season Audit\n\nVisible card ratings only. No free agents. Veteran cards were not inflated.\n\n| Rank | Team | Power | Sim W |\n|---:|---|---:|---:|\n';rows.forEach((r,i)=>out+=`| ${i+1} | ${r.name} | ${r.p.toFixed(2)} | ${r.w.toFixed(2)} |\n`);fs.writeFileSync('SEASON-SIM-YOUNG-TRAJECTORY-10000.md',out);console.log(out);
          JS
          node /tmp/sim.js
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/season-young-trajectory-pass.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add foundation-v0.9.0.js SEASON-SIM-YOUNG-TRAJECTORY-10000.md .github/workflows/season-young-trajectory-pass.yml
          git commit -m "Apply young-player trajectory ratings"
          git push
