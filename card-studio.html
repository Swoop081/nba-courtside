<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>NBA Courtside Card Studio</title><link rel="stylesheet" href="styles.css?v=0.5.0"><link rel="stylesheet" href="art-v0.4.css?v=0.5.0"><link rel="stylesheet" href="card-studio.css?v=0.5.0"></head><body><main class="studio-shell"><header class="studio-topbar"><div><div class="eyebrow">NBA COURTSIDE</div><h1>Card Studio</h1><p>Position production player art on the live card.</p></div><a class="studio-link" href="index.html">Back to Game</a></header><section class="studio-layout"><div class="preview-column"><div id="studioCard" class="studio-card-wrap"></div><div class="safe-note">Dashed guide = recommended player-art safe zone. It does not appear in-game.</div></div><aside class="controls"><label class="field"><span>Player</span><select id="playerSelect"></select></label><div class="source-card"><h2>Player Art</h2><label class="field"><span>Image URL / repo path</span><input id="artUrlInput" type="url" inputmode="url" placeholder="https://… or assets/player-art/name.png"></label><div class="source-actions"><button id="loadUrlBtn" class="secondary-btn">Load URL</button><label class="upload-btn">Preview local file<input id="fileInput" type="file" accept="image/png,image/webp,image/jpeg"></label></div><small>Local file upload is preview-only. A URL or repo path can be saved for use in the game.</small></div><div class="slider-grid"><label><span>Horizontal <b id="xValue">58%</b></span><input id="xRange" type="range" min="0" max="100" step="1"></label><label><span>Vertical <b id="yValue">100%</b></span><input id="yRange" type="range" min="0" max="100" step="1"></label><label><span>Scale <b id="scaleValue">0.72×</b></span><input id="scaleRange" type="range" min="0.25" max="1.6" step="0.01"></label><label><span>Rotation <b id="rotationValue">0°</b></span><input id="rotationRange" type="range" min="-20" max="20" step="1"></label></div><div class="toggle-row"><label><input id="effectsToggle" type="checkbox" checked> Show foil/effects</label><label><input id="safeToggle" type="checkbox" checked> Show safe zone</label></div><div class="button-stack"><button id="saveBtn" class="primary-btn">Save to Game</button><button id="resetBtn" class="secondary-btn">Reset This Player</button><button id="copyBtn" class="secondary-btn">Copy Composition JSON</button></div><div id="status" class="status">Changes preview instantly.</div></aside></section></main><script src="card-studio.js?v=0.5.0"></script></body></html>
